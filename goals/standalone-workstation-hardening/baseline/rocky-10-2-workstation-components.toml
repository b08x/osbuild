[customizations]
hostname = "syncopated-dx"

# Static, non-composable part of the Rocky 10.2 workstation blueprint.
# name/description/version/distro, packages, [customizations] (hostname =
# osbuild_hostname), [customizations.kernel] and
# [customizations.services] are rendered by templates/blueprint-components.toml.j2
# from the selected components; do not define them here.
#
# Secure Boot is NOT compatible with the unsigned proprietary NVIDIA modules —
# disable it or enroll a MOK on the target machine.
#
# sway and the wlroots stack are not built for EPEL 10 and are excluded.


[customizations.installer.modules]
enable = ["org.fedoraproject.Anaconda.Modules.Users"]
disable = ["org.fedoraproject.Anaconda.Modules.Subscription"]

[customizations.firewall]
ports = ["24800:tcp", "9090:tcp"]

[customizations.firewall.services]
enabled = ["ssh", "ntp", "samba-client", "rsyncd"]

[customizations.timezone]
timezone = "America/New_York"
ntpservers = ["2.rhel.pool.ntp.org"]

[customizations.locale]
languages = ["en_US.UTF-8"]
keyboard = "us"

[[customizations.files]]
path = "/etc/dnf/dnf.conf"
mode = "0755"
data = """
# see `man dnf.conf` for defaults and possible options

[main]
fastestmirror=1
max_parallel_downloads=10
clean_requirements_on_remove=True
"""

# Docker CE Stable
[[customizations.repositories]]
id = "docker-ce-stable"
name = "Docker CE Stable - x86_64"
baseurls = ["https://download.docker.com/linux/centos/10/x86_64/stable"]
gpgcheck = false
gpgkeys = ["https://download.docker.com/linux/centos/gpg"]
enabled = true
[customizations.services]
enabled = [
    "sshd",
    "NetworkManager",
    "firewalld",
    "chronyd",
    "gdm",
    "cockpit.socket",
]

# --- component fragment: vscode.toml ---
# Appended verbatim by the osbuild role for the vscode component.
# Array-of-tables only.

[[customizations.repositories]]
id = "code"
name = "Visual Studio Code"
baseurls = ["https://packages.microsoft.com/yumrepos/vscode"]
gpgcheck = true
gpgkeys = ["https://packages.microsoft.com/keys/microsoft.asc"]
enabled = true
# --- component fragment: syncopated.toml ---
[[customizations.repositories]]
id = "copr-syncopated"
name = "Syncopated"
baseurls = ["https://download.copr.fedorainfracloud.org/results/b08x/syncopated/epel-10-x86_64/"]
gpgcheck = true
gpgkeys = ["https://download.copr.fedorainfracloud.org/results/b08x/syncopated/pubkey.gpg"]
enabled = true
# BEGIN syncopated-firstboot
# First-login splash (roles/osbuild/files/firstboot/). Injected into every
# prepared blueprint by tasks/blueprint.yml; edit the source files, not this.

[[customizations.files]]
path = "/usr/local/bin/syncopated-firstboot"
mode = "0755"
data = '''
#!/usr/bin/env bash
# syncopated-firstboot: first-login splash, run as the logged-in user.
#   System:   update the system with dnf, run ansible-pull when the image
#             carries an ansible-pull configuration, offer a reboot when
#             updates were installed, set the default boot target, report
#             installed tools.
#   Dotfiles: download yadm to ~/.local/bin when it is missing, then print the
#             commands that clone a dotfiles repository and run
#             `yadm bootstrap`. The script does not run those; the user runs
#             them when ready.
# After the commands are printed the marker is written and setup is complete.
#
# The autostart launcher (syncopated-firstboot-launcher) stops opening this
# script once the per-user marker exists. Running it by name always shows the
# splash, so setup can be repeated at any time.
#
# Overrides (used by the bats tests): SYNCOPATED_OS_RELEASE,
# SYNCOPATED_YADM_URL, SYNCOPATED_DOTFILES_URL, SYNCOPATED_CHECK_TOOLS,
# SYNCOPATED_ANSIBLE_PULL_CONF (path of the ansible-pull configuration),
# SYNCOPATED_NO_ANIM=1 (skip the splash reveal delay),
# SYNCOPATED_PAUSE_ON_EXIT=1 (set by the launcher: wait for Enter before
# exiting).

OS_RELEASE=${SYNCOPATED_OS_RELEASE:-/etc/os-release}
STATE_DIR=${XDG_STATE_HOME:-$HOME/.local/state}/syncopated
MARKER=$STATE_DIR/firstboot.done
YADM_URL=${SYNCOPATED_YADM_URL:-https://github.com/yadm-dev/yadm/raw/master/yadm}
DOTFILES_URL=${SYNCOPATED_DOTFILES_URL:-https://github.com/b08x/dots.git}
# Written into the image when osbuild_ansible_pull_repo and
# osbuild_ansible_pull_args are set; defines ANSIBLE_PULL_REPO (string) and
# ANSIBLE_PULL_ARGS (array). Without the file there is no ansible_pull step.
ANSIBLE_PULL_CONF=${SYNCOPATED_ANSIBLE_PULL_CONF:-/etc/syncopated-ansible-pull.conf}
read -r -a CHECK_TOOLS <<<"${SYNCOPATED_CHECK_TOOLS:-git yadm gum ansible podman zsh flatpak nvidia-smi}"

# Step return codes.
RC_OK=0
RC_FAILED=1
RC_SKIPPED=2

SYSTEM_STEPS=(update target)
ANSIBLE_PULL_ENABLED=0
if [[ -r $ANSIBLE_PULL_CONF ]]; then
  ANSIBLE_PULL_ENABLED=1
  SYSTEM_STEPS=(update ansible_pull target)
fi
# Set by update_system when dnf installed or upgraded at least one package.
UPDATES_INSTALLED=0
declare -A STEP_STATE=()

# Brand palette, sampled from the Syncopated logo: a violet mark and an ember
# wordmark, each with a dim tone for the light glyphs. Each entry is
# (hex for gum and 24-bit terminals, 256-color index for other terminals).
VIOLET=('#7B4FE0' 98)
VIOLET_DIM=('#4B3A8C' 60)
VIOLET_LIGHT=('#A98BF0' 141)
EMBER=('#D2601A' 166)
EMBER_DIM=('#7A3A1C' 94)

# Theme gum's prompts with the palette. GUM_* values already set by the user win.
export GUM_CHOOSE_HEADER_FOREGROUND=${GUM_CHOOSE_HEADER_FOREGROUND:-${VIOLET_LIGHT[0]}}
export GUM_CHOOSE_CURSOR_FOREGROUND=${GUM_CHOOSE_CURSOR_FOREGROUND:-${EMBER[0]}}
export GUM_CHOOSE_SELECTED_FOREGROUND=${GUM_CHOOSE_SELECTED_FOREGROUND:-${EMBER[0]}}

# Splash art (~/Images/brand-logo-selectionB-ascii-art.txt, trailing blanks
# and the common 3-column indent removed). Columns before ART_SPLIT are the
# mark; the rest is the wordmark. Glyphs in ART_DIM_GLYPHS take the dim tone.
ART_SPLIT=42
ART_DIM_GLYPHS=".'\`,:;^\"!Iil"
mapfile -t ART <<'ART'
                    Il
                 "+(tt)>.
               ,[ftfff//)I
              <tttt\1)/\/\<
           'i1tt/f[}_,_/\|\;
         ,_|tt////(_<~{\|||_
      ^<)tt//////\//\\\||((-   ..
  ':+)tt\|////\\\\||||(((()1: ,:.                                                                                                   .``                          ``.
