# --- output ------------------------------------------------------------------

have_gum() {
  command -v gum >/dev/null 2>&1
}

# style COLOR LINE... : print lines in a foreground color (hex or 256-color).
style() {
  local color=$1
  shift
  if have_gum; then
    gum style --foreground "$color" "$@"
  else
    printf '%s\n' "$@"
  fi
}

info() { style "${VIOLET_LIGHT[0]}" "➜ $*"; }
ok() { style "${EMBER[0]}" "✓ $*"; }
warn() { style '#E0A030' "! $*" >&2; }
err() { style '#D03030' "✗ $*" >&2; }

# fg HEX INDEX : print the SGR sequence for a foreground color. Uses 24-bit
# color when the terminal reports it in COLORTERM, else the 256-color index.
fg() {
  local hex=${1#\#}
  if [[ ${COLORTERM:-} == truecolor || ${COLORTERM:-} == 24bit ]]; then
    printf '\e[38;2;%d;%d;%dm' "0x${hex:0:2}" "0x${hex:2:2}" "0x${hex:4:2}"
  else
    printf '\e[38;5;%sm' "$2"
  fi
}

# os_field KEY : print the value of KEY from os-release, without quotes.
os_field() {
  local key=$1 line value
  [[ -r $OS_RELEASE ]] || return 1
  while IFS= read -r line || [[ -n $line ]]; do
    [[ $line == "$key="* ]] || continue
    value=${line#*=}
    value=${value#[\"\']}
    value=${value%[\"\']}
    printf '%s\n' "$value"
    return 0
  done <"$OS_RELEASE"
  return 1
}

os_label() {
  local name version
  name=$(os_field NAME) || name=Linux
  version=$(os_field VERSION_ID) || version=
  printf '%s\n' "$name${version:+ $version}"
}

restore_terminal() {
  [[ -t 1 ]] || return 0
  tput sgr0 2>/dev/null
  tput cnorm 2>/dev/null
  return 0
}

# paint_art WIDTH : fill ART_PAINTED with the ART lines cut to WIDTH columns,
# each glyph colored by region (mark or wordmark) and weight (dim or full).
paint_art() {
  local width=$1 row col line ch tone prev out
  local -A seq=(
    [mark]=$(fg "${VIOLET[@]}") [mark_dim]=$(fg "${VIOLET_DIM[@]}")
    [word]=$(fg "${EMBER[@]}") [word_dim]=$(fg "${EMBER_DIM[@]}")
  )
  ART_PAINTED=()
  for ((row = 0; row < ${#ART[@]}; row++)); do
    line=${ART[row]:0:width} out='' prev=''
    for ((col = 0; col < ${#line}; col++)); do
      ch=${line:col:1}
      if [[ $ch == ' ' ]]; then
        out+=' '
        continue
      fi
      # The logo image draws "{1{}" on the mark's second-to-last row in ember.
      if ((col < ART_SPLIT)) && ! ((row == 19 && col >= 10 && col <= 13)); then
        tone=mark
      else
        tone=word
      fi
      [[ $ART_DIM_GLYPHS == *"$ch"* ]] && tone+=_dim
      [[ $tone == "$prev" ]] || out+=${seq[$tone]}
      prev=$tone
      out+=$ch
    done
    ART_PAINTED+=("$out"$'\e[0m')
  done
}

# Full-screen splash: the art centered, revealed row by row, then held with a
# pulsing "press enter to begin" until Enter. A terminal narrower than the art
# shows the mark only. Prints the art uncolored and returns at once when stdin
# or stdout is not a terminal. SYNCOPATED_NO_ANIM=1 skips the reveal delay.
splash() {
  if [[ ! -t 0 || ! -t 1 ]] || ! tput cup 0 0 >/dev/null 2>&1; then
    printf '%s\n' "${ART[@]}"
    return 0
  fi
  local rows cols width=0 height=${#ART[@]} line row top left prompt='press enter to begin' prow pcol lit=1 rc
  rows=$(tput lines)
  cols=$(tput cols)
  for line in "${ART[@]}"; do
    ((${#line} > width)) && width=${#line}
  done
  ((width > cols)) && width=$((ART_SPLIT < cols ? ART_SPLIT : cols))
  paint_art "$width"

  top=$(((rows - height - 2) / 2))
  ((top < 0)) && top=0
  left=$(((cols - width) / 2))
  prow=$((top + height + 2 < rows ? top + height + 2 : rows - 1))
  pcol=$(((cols - ${#prompt}) / 2))
  ((pcol < 0)) && pcol=0

  clear
  tput civis 2>/dev/null
  for ((row = 0; row < height; row++)); do
    tput cup $((top + row)) "$left"
    printf '%s' "${ART_PAINTED[row]}"
    [[ -n ${SYNCOPATED_NO_ANIM:-} ]] || sleep 0.03
  done
  while :; do
    tput cup "$prow" "$pcol"
    if ((lit)); then fg "${EMBER[@]}"; else fg "${EMBER_DIM[@]}"; fi
    printf '%s\e[0m' "$prompt"
    lit=$((1 - lit))
    read -r -s -t 0.8 _
    rc=$?
    # 0 = Enter, >128 = timeout (pulse again), anything else = EOF/error.
    ((rc > 128)) || break
  done
  clear
  tput cnorm 2>/dev/null
}

banner() {
  local label
  label=$(os_label)
  if have_gum; then
    gum style --border double --border-foreground "${VIOLET[0]}" --foreground "${EMBER[0]}" \
      --align center --width 60 --padding "1 2" \
      "SYNCOPATED" "$label" "First login setup"
  else
    printf '%s\n' \
      "============================================================" \
      "  SYNCOPATED  |  $label  |  First login setup" \
      "============================================================"
  fi
}

# step_lines STEP... : append one "icon step (state)" line per step to LINES.
step_lines() {
  local step state icon
  for step in "$@"; do
    state=${STEP_STATE[$step]:-pending}
    case $state in
      ok) icon='✓' ;;
      failed) icon='✗' ;;
      skipped) icon='-' ;;
      *) icon='·' ;;
    esac
    LINES+=("  $icon $step ($state)")
  done
}

# draw_steps : print the system steps.
draw_steps() {
  local LINES=('System')
  step_lines "${SYSTEM_STEPS[@]}"
  local lines=("${LINES[@]}")
  if have_gum; then
    gum style --border rounded --border-foreground "${VIOLET_DIM[0]}" --padding "0 2" "${lines[@]}"
  else
    printf '  %s\n' "${lines[@]}"
  fi
}

# --- prompts -------------------------------------------------------------------

# choose HEADER OPTION... : print the selected option. Fails on cancel/EOF.
choose() {
  local header=$1 reply opt i
  shift
  if have_gum; then
    gum choose --header "$header" "$@"
    return
  fi
  printf '%s\n' "$header" >&2
  for ((i = 1; i <= $#; i++)); do
    printf '  %d) %s\n' "$i" "${!i}" >&2
  done
  while :; do
    read -r -p "Choose [1-$#]: " reply || return 1
    if [[ $reply =~ ^[0-9]+$ ]] && ((reply >= 1 && reply <= $#)); then
      printf '%s\n' "${!reply}"
      return 0
    fi
    for opt in "$@"; do
      [[ $reply == "$opt" ]] && { printf '%s\n' "$opt"; return 0; }
    done
    printf 'Enter a number from 1 to %d.\n' "$#" >&2
  done
}

# --- steps ---------------------------------------------------------------------

acquire_lock() {
  command -v flock >/dev/null 2>&1 || return 0
  local dir=${XDG_RUNTIME_DIR:-$STATE_DIR}
  mkdir -p "$dir" 2>/dev/null || return 0
  exec {LOCK_FD}>"$dir/syncopated-firstboot.lock" || return 0
  flock -n "$LOCK_FD"
}

write_marker() {
  mkdir -p "$STATE_DIR" && date -Is >"$MARKER"
}

wait_for_network() {
  command -v nm-online >/dev/null 2>&1 || return 0
  info "Waiting for the network (up to 30 s)"
  nm-online -q -t 30 || warn "The network is not online yet."
}

# Install yadm to ~/.local/bin when it is not on PATH. Returns 0 when yadm is
# available afterwards. On failure the manual download command is printed.
install_yadm() {
  command -v yadm >/dev/null 2>&1 && return 0
  local dest=$HOME/.local/bin/yadm
  info "Installing yadm to $dest"
  if mkdir -p "${dest%/*}" && curl -fsSL -o "$dest" "$YADM_URL" && chmod 0755 "$dest"; then
    ok "yadm installed"
    return 0
  fi
  rm -f "$dest"
  warn "Could not download yadm from $YADM_URL. Run later:"
  printf '  %s\n' \
    "mkdir -p ~/.local/bin && curl -fsSL -o ~/.local/bin/yadm $YADM_URL && chmod 0755 ~/.local/bin/yadm"
  return 1
}

# Install yadm when missing, then print the commands that install the
# dotfiles. Only the yadm download is run; the clone and bootstrap commands
# go to stdout without styling so they can be copied as they are.
print_dotfiles_commands() {
  install_yadm
  info "Dotfiles (yadm): run these commands in a terminal to install your dotfiles."
  printf '  %s\n' \
    "yadm clone --no-bootstrap $DOTFILES_URL" \
    "yadm bootstrap"
}

# Apply every available package update. dnf prints "Nothing to do." when
# there is nothing to install; any other successful run installed something.
update_system() {
  if ! command -v dnf >/dev/null 2>&1; then
    info "dnf not found; system update skipped."
    return "$RC_SKIPPED"
  fi
  local log rc
  log=$(mktemp) || return "$RC_FAILED"
  info "Updating the system: sudo dnf -y upgrade --refresh"
  sudo dnf -y upgrade --refresh 2>&1 | tee "$log"
  rc=${PIPESTATUS[0]}
  if ((rc != 0)); then
    rm -f "$log"
    err "System update failed (dnf exit $rc). Run later: sudo dnf upgrade --refresh"
    return "$RC_FAILED"
  fi
  if grep -q '^Nothing to do\.' "$log"; then
    ok "System is up to date"
  else
    UPDATES_INSTALLED=1
    ok "System updated"
  fi
  rm -f "$log"
  return "$RC_OK"
}

# Run ansible-pull as root with the repository and arguments from
# $ANSIBLE_PULL_CONF. Skipped when the configuration is incomplete or
# ansible-pull is not installed.
run_ansible_pull() {
  local ANSIBLE_PULL_REPO='' ANSIBLE_PULL_ARGS=() rc
  # shellcheck source=/dev/null
  if ! source "$ANSIBLE_PULL_CONF"; then
    err "Could not read $ANSIBLE_PULL_CONF."
    return "$RC_FAILED"
  fi
  if [[ -z $ANSIBLE_PULL_REPO ]] || ((${#ANSIBLE_PULL_ARGS[@]} == 0)); then
    info "ansible-pull repository or arguments not set in $ANSIBLE_PULL_CONF; skipped."
    return "$RC_SKIPPED"
  fi
  if ! command -v ansible-pull >/dev/null 2>&1; then
    warn "ansible-pull not found; install ansible-core in the image. Skipped."
    return "$RC_SKIPPED"
  fi
  info "Running: sudo ansible-pull -U $ANSIBLE_PULL_REPO ${ANSIBLE_PULL_ARGS[*]}"
  sudo ansible-pull -U "$ANSIBLE_PULL_REPO" "${ANSIBLE_PULL_ARGS[@]}"
  rc=$?
  if ((rc != 0)); then
    err "ansible-pull failed (exit $rc). Run later: sudo ansible-pull -U $ANSIBLE_PULL_REPO ${ANSIBLE_PULL_ARGS[*]}"
    return "$RC_FAILED"
  fi
  ok "ansible-pull finished"
  return "$RC_OK"
}

# Offer a reboot after installed updates. Returns 0 only when the reboot was
# started. No marker is written, so the splash opens again at the next login,
# where the update finds nothing to do and setup continues.
offer_reboot() {
  local action
  action=$(choose "Updates were installed. Reboot now? Setup continues at the next login." \
    "Reboot now" "Continue setup") || action="Continue setup"
  [[ $action == "Reboot now" ]] || return 1
  info "Rebooting. The splash opens again at the next login."
  if ! sudo systemctl reboot; then
    warn "Could not reboot (sudo failed). Continuing setup."
    return 1
  fi
}

# Boot to the display manager when one is installed.
set_graphical_target() {
  local units
  units=$(systemctl list-unit-files --no-legend gdm.service lightdm.service sddm.service 2>/dev/null)
  if [[ -z $units ]]; then
    info "No display manager installed; default target unchanged."
    return "$RC_OK"
  fi
  if [[ $(systemctl get-default 2>/dev/null) == graphical.target ]]; then
    ok "Default target is already graphical.target"
    return "$RC_OK"
  fi
  if sudo systemctl set-default graphical.target; then
    ok "Default target set to graphical.target"
  else
    warn "Could not set graphical.target (sudo failed). Run: sudo systemctl set-default graphical.target"
  fi
  return "$RC_OK"
}

# run_step NAME COMMAND... : run a step, record its state, redraw the list.
run_step() {
  local name=$1 rc
  shift
  "$@"
  rc=$?
  case $rc in
    "$RC_OK") STEP_STATE[$name]=ok ;;
    "$RC_SKIPPED") STEP_STATE[$name]=skipped ;;
    *) STEP_STATE[$name]=failed ;;
  esac
  draw_steps
  return "$rc"
}

report() {
  local tool rows=()
  for tool in "${CHECK_TOOLS[@]}"; do
    if command -v "$tool" >/dev/null 2>&1; then
      rows+=("✓ ready    $tool")
    else
      rows+=("✗ missing  $tool")
    fi
  done
  if have_gum; then
    gum style --border rounded --border-foreground "${EMBER_DIM[0]}" --padding "0 2" "Tool check" "${rows[@]}"
  else
    printf '%s\n' "Tool check" "${rows[@]/#/  }"
  fi
}

main() {
  if [[ ${EUID:-$(id -u)} -eq 0 ]]; then
    err "Run syncopated-firstboot as your own user, not as root."
    return 1
  fi
  if ! acquire_lock; then
    warn "syncopated-firstboot is already running."
    return 0
  fi
  trap restore_terminal EXIT

  splash
  banner
  [[ -e $MARKER ]] && info "Setup was completed before ($(<"$MARKER")). Running again."
  draw_steps

  # System setup: runs on every login until the marker exists.
  wait_for_network
  run_step update update_system
  ((ANSIBLE_PULL_ENABLED)) && run_step ansible_pull run_ansible_pull
  if ((UPDATES_INSTALLED)) && offer_reboot; then
    return 0
  fi
  run_step target set_graphical_target
  report

  # Dotfiles: print the yadm commands; the user runs them.
  print_dotfiles_commands
  write_marker
  ok "Setup complete. The splash will not open at login again. Run syncopated-firstboot to show these commands again."
}

if [[ ${BASH_SOURCE[0]} == "$0" ]]; then
  set -uo pipefail
  main "$@"
  rc=$?
  if [[ -n ${SYNCOPATED_PAUSE_ON_EXIT:-} ]] && [[ -t 0 ]]; then
    read -rp 'Press Enter to close…' _
  fi
  exit "$rc"
fi
'''

[[customizations.files]]
path = "/usr/local/bin/syncopated-firstboot-launcher"
mode = "0755"
data = '''
#!/usr/bin/env bash
# syncopated-firstboot-launcher: XDG autostart entry point. Opens a terminal
# that runs syncopated-firstboot as the logged-in user, unless that user's
# marker file exists. The script asks for elevated rights itself only for
# the one system change it makes.

set -u

marker=${XDG_STATE_HOME:-$HOME/.local/state}/syncopated/firstboot.done
script=${SYNCOPATED_FIRSTBOOT:-/usr/local/bin/syncopated-firstboot}

[[ -e $marker ]] && exit 0
[[ ${EUID:-$(id -u)} -ne 0 ]] || exit 0

# The script waits for Enter before exiting, so the printed yadm commands
# stay on screen.
cmd="SYNCOPATED_PAUSE_ON_EXIT=1 $(printf '%q' "$script")"

for term in xdg-terminal-exec ptyxis kgx gnome-terminal kitty foot alacritty xterm; do
    command -v "$term" >/dev/null 2>&1 || continue
    case $term in
        kitty) exec "$term" --start-as fullscreen bash -c "$cmd" ;;
        xdg-terminal-exec | foot) exec "$term" bash -c "$cmd" ;;
        ptyxis) exec ptyxis --new-window -- bash -c "$cmd" ;;
        kgx | gnome-terminal) exec "$term" -- bash -c "$cmd" ;;
        alacritty | xterm) exec "$term" -e bash -c "$cmd" ;;
    esac
done

echo "syncopated-firstboot-launcher: no terminal emulator found; run $script manually." >&2
exit 1
'''

[[customizations.files]]
path = "/etc/xdg/autostart/syncopated-firstboot.desktop"
mode = "0644"
data = '''
[Desktop Entry]
Type=Application
Name=Syncopated First Boot
Comment=Clone dotfiles with yadm and run yadm bootstrap
Exec=/usr/local/bin/syncopated-firstboot-launcher
Terminal=false
NoDisplay=true
X-GNOME-Autostart-enabled=true
X-GNOME-Autostart-Delay=5
'''
