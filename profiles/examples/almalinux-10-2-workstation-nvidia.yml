---
# AlmaLinux Workstation 10.2 (NVIDIA).
# Replaces playbooks/osbuild-almalinux-iso-nvidia.yml.
#
#   ansible-playbook playbooks/build.yml -e @profiles/examples/almalinux-10-2-workstation-nvidia.yml
#
# Copy to profiles/<name>.yml (gitignored) and set disk, users and locale for
# the machine it installs.
#
# Secure Boot is not compatible with the unsigned proprietary NVIDIA modules:
# disable it or enroll a MOK on the target machine. /usr is sized for CUDA
# (80 GiB) because nvidia is selected.
intent:
  version: 1
  name: almalinux-10-2-workstation-nvidia
  description: AlmaLinux Workstation 10.2 (NVIDIA)
  distro: almalinux-10.2
  arch: x86_64
  hostname: workstation
  components:
    - base
    - anaconda
    - gnome-desktop
    - fonts
    - audio
    - multimedia
    - google-chrome
    - vscode
    - intel-graphics
    - development
    - containers-virt
    - cockpit
    - nvidia
    - syncopated
  hardening: none
  disk:
    # Declared disk size: 476 GiB is a 512 GB disk. Smaller disks abort the
    # install; larger ones give the surplus to /home.
    size_gib: 476
    encrypt: false
    tmp: tmpfs
  users:
    - name: syncopated
      gecos: Syncopated Admin
  locale:
    language: en_US.UTF-8
    keyboard: us
    timezone: America/New_York
  remote_logging:
    enabled: false
