---
# vars file for osbuild
#
# Repository gpgkey strategy (refactored 2026-06-06):
#   - Prefer file:// URLs to /usr/share/distribution-gpg-keys/ when the key is bundled there
#     (installed by the `distribution-gpg-keys` package, which is signed by the Fedora release key)
#   - Use https:// URLs for repos whose keys are not bundled (current keys fetched at build time)
#   - Omit gpgkey_url for repos with check_gpg: false (e.g., antigravity-rpm)
#
# Keys are fetched at build time by roles/osbuild/tasks/repo_keys.yml.
# Each key is verified to contain a valid '-----END PGP PUBLIC KEY BLOCK-----' marker before use.
#
# To verify a key URL: curl -sSL -o /dev/null -w "%{http_code}\n" <url>
# To inspect the key content: curl -sSL <url> | head -5
# See trackboi card card-should-refactor-gpgkeys-to-runtime-url-fetch-eli-1snigie
# for the URL verification log and the distribution-gpg-keys package inventory.

repo:
  fedora:
    metalink: "https://mirrors.fedoraproject.org/metalink?repo=fedora-43&arch=x86_64"
    gpgkey_url: "file:///usr/share/distribution-gpg-keys/fedora/RPM-GPG-KEY-fedora-43-primary"
    check_gpg: true
  updates:
    metalink: "https://mirrors.fedoraproject.org/metalink?repo=updates-released-f43&arch=x86_64"
    gpgkey_url: "file:///usr/share/distribution-gpg-keys/fedora/RPM-GPG-KEY-fedora-43-primary"
    check_gpg: true
  rpmfusion-free:
    baseurl: "http://download1.rpmfusion.org/free/fedora/releases/43/Everything/x86_64/os/"
    gpgkey_url: "file:///usr/share/distribution-gpg-keys/rpmfusion/RPM-GPG-KEY-rpmfusion-free-fedora-43"
    check_gpg: true
  rpmfusion-nonfree:
