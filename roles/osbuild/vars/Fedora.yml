    gpgkey_url: "file:///usr/share/distribution-gpg-keys/rpmfusion/RPM-GPG-KEY-rpmfusion-nonfree-fedora-43"
    check_gpg: true
  rpmfusion-free-updates:
    baseurl: "http://download1.rpmfusion.org/free/fedora/updates/43/x86_64/"
    gpgkey_url: "file:///usr/share/distribution-gpg-keys/rpmfusion/RPM-GPG-KEY-rpmfusion-free-fedora-43"
    check_gpg: true
  rpmfusion-nonfree-updates:
    baseurl: "http://download1.rpmfusion.org/nonfree/fedora/updates/43/x86_64/"
    gpgkey_url: "file:///usr/share/distribution-gpg-keys/rpmfusion/RPM-GPG-KEY-rpmfusion-nonfree-fedora-43"
    check_gpg: true
  rpmfusion-nonfree-nvidia-driver:
    baseurl: "http://download1.rpmfusion.org/nonfree/fedora/nvidia-driver/43/x86_64/"
    gpgkey_url: "file:///usr/share/distribution-gpg-keys/rpmfusion/RPM-GPG-KEY-rpmfusion-nonfree-fedora-2020"
    check_gpg: true
  intel_oneAPI:
    baseurl: "https://yum.repos.intel.com/oneapi/"
    gpgkey_url: "https://yum.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB"
    check_gpg: true
  cuda-fedora43-x86_64:
    baseurl: "https://developer.download.nvidia.com/compute/cuda/repos/fedora43/x86_64"
    gpgkey_url: "https://developer.download.nvidia.com/compute/cuda/repos/fedora43/x86_64/1940C73E.pub"
    check_gpg: true
  nvidia-container-toolkit:
