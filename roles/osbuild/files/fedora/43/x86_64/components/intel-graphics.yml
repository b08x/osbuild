# Blueprint component "intel-graphics" for Fedora 43 (x86_64).
# Split from workstation/fedora-workstation-43-nvidia.toml and workstation/fedora-workstation-43.toml.
# Entries starting with @ are comps groups. Versions are never pinned here;
# use osbuild_package_pins.
label: "Intel media driver and firmware (RPM Fusion Nonfree)"
repo_urls: []
services: []
kernel_args: []
packages:
  - "intel-audio-firmware"
  - "intel-gmmlib"
  - "intel-gpu-firmware"
  - "intel-vpl-gpu-rt"
  - "intel-vsc-firmware"
  - "intel-mediasdk"
  - "intel-qpl"
  - "libva-intel-media-driver"
