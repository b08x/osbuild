---
# Blueprint component "base" for Fedora 43 (x86_64).
# Split from workstation/fedora-workstation-43-nvidia.toml and workstation/fedora-workstation-43.toml.
# Entries starting with @ are comps groups. Versions are never pinned here;
# use osbuild_package_pins.
# The RPM Fusion URLs are depsolve sources for the whole blueprint: the
# multimedia and Intel packages come from them, and the rpmfusion-*-release
# packages below belong to this component.
label: "Base system: kernel, networking, CLI tools, ansible runtime"
repo_urls:
  - "http://download1.rpmfusion.org/free/fedora/releases/43/Everything/x86_64/os/"
  - "http://download1.rpmfusion.org/free/fedora/updates/43/x86_64/"
  - "http://download1.rpmfusion.org/nonfree/fedora/releases/43/Everything/x86_64/os/"
  - "http://download1.rpmfusion.org/nonfree/fedora/updates/43/x86_64/"
services:
  - "sshd"
  - "NetworkManager"
  - "firewalld"
  - "chronyd"
kernel_args: []
packages:
  - "@headless-management"
  - "@system-tools"
  - "NetworkManager"
  - "ansible-collection-ansible-posix"
  - "aria2"
  - "bash"
  - "bind-utils"
  - "btrfs-progs"
  - "chrony"
  - "coreutils"
  - "dracut"
  - "dracut-config-rescue"
  - "efi-filesystem"
  - "erofs-utils"
  - "fastfetch"
  - "fd-find"
  - "firewalld"
  - "fwupd"
  - "fwupd-efi"
  - "fzf"
  - "gum"
  - "htop"
  - "kernel"
  - "kernel-devel"
  - "kernel-headers"
  - "kernel-modules"
  - "kernel-modules-core"
  - "kernel-modules-extra"
  - "kernel-tools"
  - "kernel-tools-libs"
  - "lnav"
  - "micro"
  - "net-tools"
  - "nfs-utils"
  - "plymouth-system-theme"
  - "polkit"
  - "python3-firewall"
  - "python3-rich"
  - "python3-psutil"
  - "ranger"
  - "rsync"
  - "tar"
  - "tuned-ppd"
  - "uv"
  - "zsh"
  - "yq"
  - "@admin-tools"
  - "NetworkManager-config-connectivity-fedora"
  - "ansible"
  - "ansible-collection-community-docker"
  - "ansible-collection-community-libvirt"
  - "ansible-collection-community-postgresql"
  - "fedora-repos"
  - "fedora-workstation-repositories"
  - "linux-system-roles"
  - "python3-libdnf5"
  - "rpmfusion-free-release"
  - "rpmfusion-nonfree-release"
  - "tuned-switcher"
  - "zoxide"
  - "lld"
  - "python3-passlib"
