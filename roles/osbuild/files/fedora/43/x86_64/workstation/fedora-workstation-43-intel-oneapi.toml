[customizations]
hostname = "syncopated-ix"

[customizations.installer.modules]
enable = ["org.fedoraproject.Anaconda.Modules.Users"]
disable = ["org.fedoraproject.Anaconda.Modules.Subscription"]

[customizations.services]
enabled = [
    "sshd",
    "NetworkManager",
    "firewalld",
    "gdm",
    "chronyd",
    "input-remapper",
]

[customizations.firewall]
ports = ["24800:tcp"]

[customizations.firewall.services]
enabled = ["ssh", "ntp", "samba-client", "rsyncd"]

[customizations.timezone]
timezone = "America/New_York"
ntpservers = ["2.fedora.pool.ntp.org"]

[customizations.locale]
languages = ["en_US.UTF-8"]
keyboard = "us"

[[customizations.files]]
path = "/etc/dnf/dnf.conf"
mode = "0755"
data = """
# see `man dnf.conf` for defaults and possible options

[main]
fastestmirror=1
max_parallel_downloads=10
clean_requirements_on_remove=True
"""

[[customizations.files]]
path = "/etc/profile.d/intel-oneapi.sh"
data = """
#!/bin/bash
# Initialize Intel oneAPI environment variables on login
if [ -f /opt/intel/oneapi/setvars.sh ]; then
    source /opt/intel/oneapi/setvars.sh --force > /dev/null 2>&1
fi
"""

[[customizations.repositories]]
id = "docker-ce-stable"
name = "Docker CE Stable - x86_64"
baseurls = ["https://download.docker.com/linux/fedora/43/x86_64/stable"]
gpgcheck = true
gpgkeys = ["https://download.docker.com/linux/fedora/gpg"]
enabled = true

[[customizations.repositories]]
id = "code"
name = "Visual Studio Code"
baseurls = ["https://packages.microsoft.com/yumrepos/vscode"]
gpgcheck = true
gpgkeys = ["https://packages.microsoft.com/keys/microsoft.asc"]
enabled = true

[[customizations.repositories]]
id = "Intel-OneAPI"
name = "Intel OneAPI"
baseurls = ["https://yum.repos.intel.com/oneapi"]
gpgcheck = true
gpgkeys = [
    "https://yum.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB",
]
enabled = true
