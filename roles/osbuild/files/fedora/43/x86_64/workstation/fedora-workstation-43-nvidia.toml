[[customizations.repositories]]
id = "nvidia-container-toolkit"
name = "nvidia-container-toolkit"
baseurls = ["https://nvidia.github.io/libnvidia-container/stable/rpm/x86_64"]
gpgcheck = true
gpgkeys = ["https://nvidia.github.io/libnvidia-container/gpgkey"]
enabled = true

[[customizations.repositories]]
id = "cuda-fedora43-x86_64"
name = "CUDA for Fedora 43"
baseurls = [
    "https://developer.download.nvidia.com/compute/cuda/repos/fedora43/x86_64",
]
gpgcheck = true
gpgkeys = [
    "https://developer.download.nvidia.com/compute/cuda/repos/fedora43/x86_64/1940C73E.pub",
]
enabled = true

[[customizations.repositories]]
id = "docker-ce-stable"
name = "Docker CE Stable - x86_64"
baseurls = ["https://download.docker.com/linux/fedora/43/x86_64/stable"]
gpgcheck = true
gpgkeys = ["https://download.docker.com/linux/fedora/gpg"]
enabled = true
