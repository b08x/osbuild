[customizations]
hostname = "syncopated-gx"

[customizations.installer.modules]
enable = ["org.fedoraproject.Anaconda.Modules.Users"]
disable = ["org.fedoraproject.Anaconda.Modules.Subscription"]

[customizations.kernel]
append = "rd.driver.blacklist=nouveau rd.driver.blacklist=nova-core modprobe.blacklist=nouveau nvidia-drm.modeset=1"

[customizations.services]
enabled = [
    "sshd",
    "nvidia-cdi-refresh",
    "NetworkManager",
    "firewalld",
    "gdm",
    "chronyd",
    "input-remapper",
]

[customizations.firewall]
ports = ["24800:tcp"]

[customizations.firewall.services]
enabled = ["ssh", "ntp", "samba-client", "rsyncd"]

[customizations.timezone]
timezone = "America/New_York"
ntpservers = ["2.fedora.pool.ntp.org"]

[customizations.locale]
languages = ["en_US.UTF-8"]
keyboard = "us"

[[customizations.files]]
path = "/etc/dnf/dnf.conf"
mode = "0755"
data = """
# see `man dnf.conf` for defaults and possible options

[main]
fastestmirror=1
max_parallel_downloads=10
clean_requirements_on_remove=True
"""

[[customizations.files]]
path = "/usr/local/bin/nvidia-cdi-generate.sh"
mode = "0755"
data = """
#!/bin/bash
# Generate NVIDIA CDI specification for Podman container GPU access
# This script waits for NVIDIA device nodes to appear before generating CDI config

set -euo pipefail

timeout=30
echo "Waiting for NVIDIA device nodes..."

while [ $timeout -gt 0 ]; do
  if [ -e /dev/nvidia0 ]; then
    echo "NVIDIA device found, generating CDI specification..."
    mkdir -p /etc/cdi
    nvidia-ctk cdi generate --output=/etc/cdi/nvidia.yaml
    echo "CDI specification generated successfully at /etc/cdi/nvidia.yaml"
    exit 0
  fi
  sleep 1
  ((timeout--))
done

echo "ERROR: NVIDIA device not found after 30 seconds" >&2
echo "This may indicate:" >&2
echo "  - NVIDIA driver not loaded" >&2
echo "  - No NVIDIA GPU present" >&2
echo "  - Driver compilation failed" >&2
exit 1
"""

[[customizations.files]]
path = "/etc/systemd/system/nvidia-cdi-refresh.service"
data = """
[Unit]
Description=Generate NVIDIA CDI specification for Podman
Documentation=https://github.com/NVIDIA/nvidia-container-toolkit
Wants=network-online.target
After=network-online.target
ConditionPathExists=/usr/bin/nvidia-ctk
ConditionPathExists=/usr/local/bin/nvidia-cdi-generate.sh

[Service]
Type=oneshot
ExecStart=/usr/local/bin/nvidia-cdi-generate.sh
RemainAfterExit=true
StandardOutput=journal
StandardError=journal

[Install]
WantedBy=multi-user.target
"""

