name = "almalinux-10-2-workstation-nvidia"
description = "AlmaLinux Workstation 10.2 (NVIDIA)"
version = "1.0.0"
# image-builder 52.1 on tinybot only ships distro definitions up to
# almalinux-10.2 (no almalinux-10.3); this field must match a distro
# `image-builder list` actually knows, so it targets 10.2.
distro = "almalinux-10.2"

# Package names verified against live AlmaLinux 10 BaseOS/AppStream/CRB, EPEL 10,
# and RPM Fusion for EL 10 repodata (2026-09-11). Packages with no equivalent in
# those repos are omitted rather than guessed; see notes inline for renames and
# drops relative to the Fedora Workstation 43 blueprint this is derived from.
#
# sway and the wlroots/Wayland-compositor stack (sway, sway-contrib, sway-systemd,
# sway-config-fedora, swaybg, swayidle, swaylock, sway-wallpapers, waybar, wofi,
# foot, grim, slurp, wlr-randr, wlsunset, kanshi, ydotool, wev,
# xdg-desktop-portal-wlr) are not built for EPEL 10 (confirmed via Fedora
# dist-git branch listings and EPEL 10 repodata) and are intentionally excluded.
# GNOME's own Wayland session (gnome-session-wayland-session) is the desktop here.
#
# RPM Fusion for EL 10 only publishes an "updates" channel — there is no
# el/releases/10 or el/nvidia-driver/10 path (both 404). ffmpeg/x264/x265 come
# from rpmfusion-free-updates and intel-media-driver from rpmfusion-nonfree-updates;
# obs-studio and vips-devel still have no EL10 build anywhere and stay dropped.
# GPG keys for rpmfusion-free-updates/rpmfusion-nonfree-updates use the
# distribution-gpg-keys "-el-10" naming, not Fedora's "-fedora-2020" keys.
#
# NVIDIA packages come from the CUDA EL10 repo (cuda-el10-x86_64 source) and the
# NVIDIA Container Toolkit repo (nvidia-container-toolkit source). The nvidia-driver
# meta-package pulls in the proprietary driver stack; cuda-toolkit provides the
# CUDA development toolchain; nvidia-container-toolkit enables Podman GPU access.
# nvidia-persistenced manages GPU device persistence across reboots.
# nvtop is an NVIDIA-aware terminal monitor (like htop but for GPUs).
# nvidia-settings provides the GUI control panel for NVIDIA GPUs.
#
# Secure Boot is NOT compatible with the proprietary NVIDIA driver — the kernel
# args below blacklist nouveau and the NVIDIA modules must be signed or Secure
# Boot must be disabled / MOK enrolled.

