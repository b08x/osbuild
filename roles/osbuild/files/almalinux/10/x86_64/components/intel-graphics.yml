---
# Blueprint component "intel-graphics" for AlmaLinux 10 (x86_64).
# Split from workstation/almalinux-10-2-workstation-nvidia.toml and workstation/almalinux-10-2-workstation.toml.
# Entries starting with @ are comps groups. Versions are never pinned here;
# use osbuild_package_pins.
label: "Intel media driver and firmware (RPM Fusion Nonfree)"
repo_urls:
  - "http://download1.rpmfusion.org/nonfree/el/updates/10/x86_64"
services: []
kernel_args: []
packages:
  - "intel-media-driver"
  - "intel-audio-firmware"
  - "intel-gmmlib"
  - "intel-gpu-firmware"
  - "intel-vpl-gpu-rt"
  - "intel-vsc-firmware"
