# Blueprint component "cockpit" for AlmaLinux 10 (x86_64).
# Split from workstation/almalinux-10-2-workstation-nvidia.toml and workstation/almalinux-10-2-workstation.toml.
# Entries starting with @ are comps groups. Versions are never pinned here;
# use osbuild_package_pins.
label: "Cockpit web console"
repo_urls: []
services: []
kernel_args: []
packages:
  - "cockpit"
  - "cockpit-bridge"
  - "cockpit-machines"
  - "cockpit-podman"
  - "cockpit-packagekit"
  - "cockpit-storaged"
  - "cockpit-ws"
  - "cockpit-ws-selinux"
