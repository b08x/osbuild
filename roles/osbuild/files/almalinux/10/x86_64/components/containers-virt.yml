---
# Blueprint component "containers-virt" for AlmaLinux 10 (x86_64).
# Split from workstation/almalinux-10-2-workstation-nvidia.toml and workstation/almalinux-10-2-workstation.toml.
# Entries starting with @ are comps groups. Versions are never pinned here;
# use osbuild_package_pins.
label: "Podman, distrobox and libvirt/KVM"
repo_urls: []
services: []
kernel_args: []
packages:
  - "@container-management"
  - "distrobox"
  - "ipxe-roms-qemu"
  - "libvirt-daemon"
  - "nbd"
  - "podman"
  - "podman-compose"
  - "podman-docker"
  - "qemu-kvm"
  - "virt-install"
  - "@virtualization-host-environment"
  - "virt-viewer"
