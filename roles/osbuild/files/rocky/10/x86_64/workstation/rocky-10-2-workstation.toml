name = "rocky-10-2-workstation"
description = "Rocky Linux Workstation 10.2"
version = "1.0.0"
# `distro` must match a name the installed image-builder actually knows
# (live `image-builder list` on tinybot, 2026-10-01: rocky-9.8 and
# rocky-10.2 are known; major-only rocky-9/rocky-10 are not).
distro = "rocky-10.2"

# Derived from the AlmaLinux 10.2 workstation blueprint — Rocky Linux is a
# RHEL-compatible clone shipping the same EL package names. Package names
# verified against live Rocky 10 BaseOS/AppStream/CRB, EPEL 10, and RPM
# Fusion for EL 10 repodata (2026-10-01): every package in the AlmaLinux
# blueprint also resolves on Rocky 10. Packages with no equivalent are
# omitted rather than guessed. Comps groups verified the same way
# (2026-10-01): all blueprint groups exist in Rocky 10 BaseOS/AppStream
# comps; "@virtualization-host-environment" is a comps environment (not a
# group) on both Rocky 10 and AlmaLinux 10, so it is kept for parity with
# the AlmaLinux blueprint.
#
# sway and the wlroots/Wayland-compositor stack are not built for EPEL 10
# (same situation as AlmaLinux) and are intentionally excluded; GNOME's
# own Wayland session is the desktop here.
#
# RPM Fusion for EL only publishes an "updates" channel — there is no
# el/releases/10 or el/nvidia-driver/10 path (both 404). ffmpeg/x264/x265
# come from rpmfusion-free-updates and intel-media-driver from
# rpmfusion-nonfree-updates. GPG keys for the RPM Fusion EL repos use the
# distribution-gpg-keys "-el-10" naming.

