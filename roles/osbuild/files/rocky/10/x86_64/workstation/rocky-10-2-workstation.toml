[customizations]
hostname = "syncopated-dx"

[customizations.installer.modules]
enable = ["org.fedoraproject.Anaconda.Modules.Users"]
disable = ["org.fedoraproject.Anaconda.Modules.Subscription"]

[customizations.services]
enabled = ["sshd", "NetworkManager", "firewalld", "gdm", "chronyd"]

[customizations.firewall]
ports = ["24800:tcp"]

[customizations.firewall.services]
enabled = ["ssh", "ntp", "samba-client", "rsyncd"]

[customizations.timezone]
timezone = "America/New_York"
ntpservers = ["2.rhel.pool.ntp.org"]

[customizations.locale]
languages = ["en_US.UTF-8"]
keyboard = "us"

[[customizations.files]]
path = "/etc/dnf/dnf.conf"
mode = "0755"
data = """
# see `man dnf.conf` for defaults and possible options

[main]
fastestmirror=1
max_parallel_downloads=10
clean_requirements_on_remove=True
"""

[[customizations.repositories]]
id = "docker-ce-stable"
name = "Docker CE Stable - x86_64"
baseurls = ["https://download.docker.com/linux/centos/10/x86_64/stable"]
gpgcheck = false
gpgkeys = ["https://download.docker.com/linux/centos/gpg"]
enabled = true
