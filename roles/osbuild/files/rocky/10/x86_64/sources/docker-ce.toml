# Docker CE EL path per docs.docker.com/engine/install (verified 2026-10-01)
id = "docker-ce-stable"
name = "Docker CE Stable"
type = "yum-baseurl"
url = "https://download.docker.com/linux/centos/10/x86_64/stable"
