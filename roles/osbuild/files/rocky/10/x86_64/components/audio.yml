---
# Blueprint component "audio" for Rocky Linux 10 (x86_64).
# Split from workstation/rocky-10-2-workstation-nvidia.toml; every name
# was verified against live repodata there (2026-10-01). Entries starting
# with @ are comps groups. Versions are never pinned here; use
# osbuild_package_pins.
label: "PipeWire audio stack"
repo_urls: []
services: []
kernel_args: []
packages:
  - "alsa-lib-devel"
  - "alsa-utils"
  - "pavucontrol"
  - "pipewire"
  - "pipewire-alsa"
  - "pipewire-devel"
  - "pipewire-gstreamer"
  - "pipewire-jack-audio-connection-kit-devel"
  - "pipewire-jack-audio-connection-kit-libs"
  - "pipewire-pulseaudio"
  - "pipewire-utils"
  - "pulseaudio-utils"
  - "wireplumber"
