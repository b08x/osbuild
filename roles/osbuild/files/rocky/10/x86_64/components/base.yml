---
# Blueprint component "base" for Rocky Linux 10 (x86_64).
# Split from workstation/rocky-10-2-workstation-nvidia.toml; every name
# was verified against live repodata there (2026-10-01). Entries starting
# with @ are comps groups. Versions are never pinned here; use
# osbuild_package_pins.
label: "Base system: kernel, networking, CLI tools, ansible runtime"
# fastfetch, fd-find, python3-rich, ... come from EPEL 10. Rocky CRB, Plus and RT are
# depsolve sources too (BaseOS/AppStream are image-builder's base repos).
repo_urls:
  - "https://mirror.us.leaseweb.net/epel/10/Everything/x86_64"
  - "https://dl.rockylinux.org/pub/rocky/10/CRB/x86_64/os/"
  - "https://dl.rockylinux.org/pub/rocky/10/plus/x86_64/os/"
  - "https://dl.rockylinux.org/pub/rocky/10/RT/x86_64/os/"
  - "https://download.copr.fedorainfracloud.org/results/b08x/syncopated/epel-10-x86_64/"
services:
  - "sshd"
  - "NetworkManager"
  - "firewalld"
  - "chronyd"
kernel_args: []
packages:
  - "@headless-management"
  - "@system-tools"
  - "NetworkManager"
  - "ansible-core"
  - "ansible-collection-ansible-posix"
  - "ansible-collection-community-general"
  - "aria2"
  - "bash"
  - "bind-utils"
  - "btrfs-progs"
  - "chrony"
  - "coreutils"
  - "dracut"
  - "dracut-config-rescue"
  - "efi-filesystem"
  - "erofs-utils"
  - "fastfetch"
  - "fd-find"
  - "firewalld"
  - "fwupd"
  - "fwupd-efi"
  - "fzf"
  - "git"
  - "gh"
  - "glab"
  - "gum"
  - "htop"
  - "kernel"
  - "kernel-devel"
  - "kernel-headers"
  - "kernel-modules"
  - "kernel-modules-core"
  - "kernel-modules-extra"
  - "kernel-tools"
  - "kernel-tools-libs"
  - "rhel-system-roles"
  - "lnav"
  - "micro"
  - "net-tools"
  - "nfs-utils"
  - "plymouth-system-theme"
  - "polkit"
  - "python3-firewall"
  - "python3-rich"
  - "python3-psutil"
  - "ranger"
  - "rsync"
  - "tar"
  - "tuned"
  - "tuned-ppd"
  - "uv"
  - "zsh"
  - "yq"
  - "input-remapper"
