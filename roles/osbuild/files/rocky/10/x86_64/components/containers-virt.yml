---
# Blueprint component "containers-virt" for Rocky Linux 10 (x86_64).
# Split from workstation/rocky-10-2-workstation-nvidia.toml; every name
# was verified against live repodata there (2026-10-01). Entries starting
# with @ are comps groups. Versions are never pinned here; use
# osbuild_package_pins.
label: "Podman, distrobox and libvirt/KVM"
repo_urls: []
services: []
kernel_args: []
packages:
  - "@container-management"
  - "distrobox"
  - "ipxe-roms-qemu"
  - "libvirt-daemon"
  - "nbd"
  - "podman"
  - "podman-compose"
  - "podman-docker"
  - "qemu-kvm"
  - "virt-install"
  - "@virtualization-host-environment"
  - "virt-viewer"
