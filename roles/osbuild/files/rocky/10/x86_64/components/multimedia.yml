label: "ffmpeg and codecs (RPM Fusion Free)"
repo_urls:
  - "http://download1.rpmfusion.org/free/el/updates/10/x86_64"
services: []
kernel_args: []
packages:
  - "ffmpeg"
  - "x264"
  - "x265"
