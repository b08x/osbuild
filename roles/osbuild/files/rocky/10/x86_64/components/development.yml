# SPDX-License-Identifier: MIT-0
---
# Blueprint component "development" for Rocky Linux 10 (x86_64).
# Split from workstation/rocky-10-2-workstation-nvidia.toml; every name
# was verified against live repodata there (2026-10-01). Entries starting
# with @ are comps groups. Versions are never pinned here; use
# osbuild_package_pins.
label: "Compilers, language toolchains and -devel packages"
# rbenv, ruby-build-rbenv and ruby-build-ruby are EPEL 10 packages
# (verified 2026-10-03). ruby-build-core ships no definitions; CRuby
# definitions (e.g. 4.0.4) come only from ruby-build-ruby.
# meson and ninja-build are CRB; sassc is EPEL 10; gtk3-devel is AppStream
# (all verified 2026-10-04).
# nodejs and nodejs-npm are AppStream. Rocky 10 has no package named "npm".
repo_urls:
  - "https://mirror.us.leaseweb.net/epel/10/Everything/x86_64"
services: []
kernel_args: []
packages:
  - "@development"
  - "@rpm-development-tools"
  - "bats"
  - "btrfs-progs-devel"
  - "cargo"
  - "chromium-headless"
  - "fedora-packager"
  - "gcc-c++"
  - "gcc"
  - "golang"
  - "gtk3-devel"
  - "libxkbfile-devel"
  - "lm_sensors-devel"
  - "meson"
  - "mock"
  - "ncurses-devel"
  - "ninja-build"
  - "nodejs-npm"
  - "nodejs"
  - "pgvector"
  - "postgresql-contrib"
  - "postgresql-server"
  - "python3-devel"
  - "python3-pip"
  - "rbenv"
  - "rpmlint"
  - "ruby-build-rbenv"
  - "ruby-build-ruby"
  - "ruby-devel"
  - "sassc"
