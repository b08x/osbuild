# SPDX-License-Identifier: MIT-0
---
# Blueprint component "openscap-pci-dss" for Rocky Linux 10 (x86_64).
# Derived from build-selections/rocky-10-latest-PCI-DSS.toml, generated by
#   oscap xccdf generate fix --profile xccdf_org.ssgproject.content_profile_pci-dss \
#     --fix-type blueprint /usr/share/xml/scap/ssg/content/ssg-rhel10-ds.xml
# Packages already in the base component (firewalld, chrony) are not repeated. Select at most ONE
# openscap-* component per blueprint: image-builder applies a single
# [customizations.openscap] profile. Versions are never pinned here; use
# osbuild_package_pins.
label: "OpenSCAP PCI-DSS v4.0.1"
repo_urls: []
services: ["auditd", "firewalld"]
kernel_args: ["audit_backlog_limit=8192", "audit=1"]
fragment: openscap-pci-dss.toml
packages:
  - "aide"
  - "audispd-plugins"
  - "audit"
  - "cronie"
  - "cryptsetup"
  - "libselinux"
  - "logrotate"
  - "nftables"
  - "postfix"
  - "sequoia-sq"
  - "sudo"
# Workstation audit policy (tasks/hardening.yml writes auditd.conf): rotate
# within a fixed cap, never halt, suspend or single-user. The stock rules that
# demand keep_logs, a small max_log_file, and halt/single/suspend/email space
# actions are unselected in the OpenSCAP tailoring, so a scan with the tailored
# profile lists them as not selected rather than failed.
# Desktop noise filter: the per-syscall DAC-modification and file-deletion
# rules fire on every file save, chmod and rename a desktop session makes.
openscap_unselected:
  - "auditd_data_retention_max_log_file_action"
  - "auditd_data_retention_max_log_file_action_stig"
  - "auditd_data_retention_max_log_file"
  - "auditd_data_retention_num_logs"
  - "auditd_data_retention_space_left"
  - "auditd_data_retention_space_left_action"
  - "auditd_data_retention_space_left_percentage"
  - "auditd_data_retention_admin_space_left_action"
  - "auditd_data_retention_admin_space_left_percentage"
  - "auditd_data_disk_full_action"
  - "auditd_data_disk_full_action_stig"
  - "auditd_data_disk_error_action"
  - "auditd_data_disk_error_action_stig"
  - "audit_rules_dac_modification_chmod"
  - "audit_rules_dac_modification_chown"
  - "audit_rules_dac_modification_fchmod"
  - "audit_rules_dac_modification_fchmodat"
  - "audit_rules_dac_modification_fchown"
  - "audit_rules_dac_modification_fchownat"
  - "audit_rules_dac_modification_fremovexattr"
  - "audit_rules_dac_modification_fsetxattr"
  - "audit_rules_dac_modification_lchown"
  - "audit_rules_dac_modification_lremovexattr"
  - "audit_rules_dac_modification_lsetxattr"
  - "audit_rules_dac_modification_removexattr"
  - "audit_rules_dac_modification_setxattr"
  - "audit_rules_dac_modification_umount"
  - "audit_rules_dac_modification_umount2"
  - "audit_rules_file_deletion_events_rename"
  - "audit_rules_file_deletion_events_renameat"
  - "audit_rules_file_deletion_events_rmdir"
  - "audit_rules_file_deletion_events_unlink"
  - "audit_rules_file_deletion_events_unlinkat"
