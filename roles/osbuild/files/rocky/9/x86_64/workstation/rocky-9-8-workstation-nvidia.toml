name = "rocky-9-8-workstation-nvidia"
description = "Rocky Linux Workstation 9.8 (NVIDIA)"
version = "1.0.0"
# `distro` must match a name the installed image-builder actually knows
# (live `image-builder list` on tinybot, 2026-10-01: rocky-9.8 and
# rocky-10.2 are known; major-only rocky-9/rocky-10 are not).
distro = "rocky-9.8"

# Derived from the Rocky 10 NVIDIA workstation blueprint (itself derived
# from AlmaLinux 10.2) — Rocky Linux is a RHEL-compatible clone shipping
# the same EL package names. Package names verified against live Rocky 9
# BaseOS/AppStream/CRB, EPEL 9, RPM Fusion for EL 9, CUDA rhel9, and
# NVIDIA Container Toolkit repodata (2026-10-01). EL 10-only names were
# replaced with their verified EL 9 equivalents where one exists and
# dropped otherwise — see the EL 9 differences notes below. Comps groups verified the same way (2026-10-01):
# all blueprint groups exist in Rocky 9 BaseOS/AppStream comps;
# "@virtualization-host-environment" is a comps environment (not a
# group) on Rocky 9 (as on Rocky 10 / AlmaLinux 10), so it is kept for
# parity with the Rocky 10 blueprint.
#
# sway and the wlroots/Wayland-compositor stack are not built for EPEL 9
# (same situation as AlmaLinux) and are intentionally excluded; GNOME's
# own Wayland session is the desktop here.
#
# RPM Fusion for EL only publishes an "updates" channel — there is no
# el/releases/9 or el/nvidia-driver/9 path (both 404, verified
# 2026-10-01). ffmpeg/x264/x265
# come from rpmfusion-free-updates and intel-media-driver from
# rpmfusion-nonfree-updates. GPG keys for the RPM Fusion EL repos use the
# distribution-gpg-keys "-el-9" naming.
#
# NVIDIA packages come from the CUDA EL9 repo (cuda-el9-x86_64 source)
# and the NVIDIA Container Toolkit repo (nvidia-container-toolkit source),
# exactly as on AlmaLinux. Secure Boot is NOT compatible with the
# proprietary NVIDIA driver — the kernel args below blacklist nouveau and
# the NVIDIA modules must be signed or Secure Boot disabled / MOK enrolled.

# EL 9 differences vs the Rocky 10 blueprint (live repodata, 2026-10-01):
#  - The EL 10 default-fonts-* meta-packages do not exist on EL 9; core
#    sans/serif/mono/emoji coverage maps to google-noto-* and dejavu-lgc-*.
#  - fontawesome-6-* and fontawesome-fonts-all map to fontawesome-fonts
#    (the EL 9 name; it is the older 4.x release line).
#  - gnome-text-editor maps to gedit (GNOME 40 era on EL 9).
#  - fwupd-efi / intel-*-firmware / nvidia-gpu-firmware do not exist on
#    EL 9; that firmware ships inside linux-firmware, which is added here.
#  - Dropped, no EL 9 build: default-fonts-cjk-mono,
#    default-fonts-core-math, google-noto-sans-meetei-mayek-vf-fonts,
#    google-noto-sans-mono-cjk-vf-fonts, google-noto-sans-oriya-vf-fonts,
#    google-noto-sans-syriac-vf-fonts, google-noto-serif-oriya-vf-fonts,
#    gum, jetbrains-mono-fonts, uv.

