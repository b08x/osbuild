# SPDX-License-Identifier: MIT-0
---
# Blueprint component "base" for Rocky Linux 9 (x86_64).
# Split from workstation/rocky-9-8-workstation-nvidia.toml and workstation/rocky-9-8-workstation.toml.
# Entries starting with @ are comps groups. Versions are never pinned here;
# use osbuild_package_pins.
label: "Base system: kernel, networking, CLI tools, ansible runtime"
repo_urls:
  - "https://mirror.us.leaseweb.net/epel/9/Everything/x86_64"
  - "https://dl.rockylinux.org/pub/rocky/9/CRB/x86_64/os/"
  - "https://dl.rockylinux.org/pub/rocky/9/plus/x86_64/os/"
  - "https://dl.rockylinux.org/pub/rocky/9/RT/x86_64/os/"
services:
  - "sshd"
  - "NetworkManager"
  - "firewalld"
  - "chronyd"
kernel_args: []
packages:
  - "@headless-management"
  - "@system-tools"
  - "NetworkManager"
  - "ansible-core"
  - "ansible-collection-ansible-posix"
  - "aria2"
  - "bash"
  - "bind-utils"
  - "btrfs-progs"
  - "chrony"
  - "coreutils"
  - "dracut"
  - "dracut-config-rescue"
  - "efi-filesystem"
  - "erofs-utils"
  - "fastfetch"
  - "fd-find"
  - "firewalld"
  - "fwupd"
  - "fzf"
  - "htop"
  - "kernel"
  - "kernel-devel"
  - "kernel-headers"
  - "kernel-modules"
  - "kernel-modules-core"
  - "kernel-modules-extra"
  - "kernel-tools"
  - "kernel-tools-libs"
  - "rhel-system-roles"
  - "lnav"
  - "micro"
  - "net-tools"
  - "nfs-utils"
  - "plymouth-system-theme"
  - "polkit"
  - "python3-firewall"
  - "python3-rich"
  - "python3-psutil"
  - "ranger"
  - "rsync"
  - "tar"
  - "tuned"
  - "tuned-ppd"
  - "zsh"
  - "yq"
  - "linux-firmware"
  - "lld"
