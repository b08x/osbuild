# SPDX-License-Identifier: MIT-0
---
# defaults file for osbuild

# =============================================================================
# Build Configuration
# =============================================================================

# Distribution version (e.g., "fedora-43", "almalinux-10.2", "rocky-10.2")
# EL distro names are point releases on the installed image-builder binary
# (live `image-builder list` knows almalinux-9.8/10.2 and rocky-9.8/10.2;
# major-only names do not resolve). See playbooks/osbuild.yml for the
# default resolution per build host.
osbuild_distro: "fedora-43"

# Distribution whose package taxonomy (vars/packages/<Name>.yml) supplies
# component package names. Derived from the TARGET (osbuild_distro), not the
# build host, so an EL 10 build on a Fedora host gets EL package names.
# Unknown prefixes fall back to the host distribution.
osbuild_target_distribution: >-
  {{ {'fedora': 'Fedora', 'rocky': 'Rocky', 'almalinux': 'AlmaLinux'}
     .get(osbuild_distro.split('-')[0], ansible_distribution) }}

# Architecture (x86_64, aarch64)
osbuild_arch: "x86_64"

# [COMPATIBILITY] Retained for backward compatibility.
# Deprecated: composer-era naming kept to avoid breaking existing inventory and playbooks.
# Migration guidance: prefer the component/image-builder equivalents where possible.
# Blueprint name (will be used for compose and output files)
osbuild_blueprint_name: "custom"

# [COMPATIBILITY] Retained for backward compatibility.
# Deprecated: composer-era blueprint metadata kept for compatibility.
# Blueprint version
osbuild_blueprint_version: "1.0.0"

# [COMPATIBILITY] Retained for backward compatibility.
# Deprecated: composer-era blueprint metadata kept for compatibility.
# Blueprint description
osbuild_blueprint_description: "Custom Workstation"

# Image type for image-builder
# [COMPATIBILITY] Retained for backward compatibility.
# Deprecated: composer-era concept; retained because existing tasks, playbooks, and tests
# still reference `osbuild_image_type`. Migration guidance: keep overriding this variable
# until every consumer migrates to the image-builder CLI type mapping.
# Live `image-builder list` (tinybot, AlmaLinux 10.2 build host, 2026-10-01):
# `minimal-installer` exists only for Fedora (fedora-42 through 45); EL
# distros (almalinux-*, rocky-*) build installer images as `image-installer`
# or `network-installer`. Other options: qcow2, ami, vhd, vmdk.
osbuild_image_type: "{{ 'minimal-installer' if ansible_distribution == 'Fedora' else 'image-installer' }}"

# Default: prepare the blueprint and write build-<blueprint>.sh next to it in
# osbuild_output_dir, without running image-builder. Run that script on the
# build host to build the image. Set false (-e osbuild_only_generate=false) to
# build inside the play. Ignored when osbuild_build_bootc is true.
osbuild_only_generate: true

# Build bootc container image (alternative to traditional ISO)
# When true, creates a bootc container image for atomic OS updates
osbuild_build_bootc: false

# =============================================================================
# Distro-Aware NVIDIA Helpers
# =============================================================================
# Extracted from nvidia component to avoid repeating regex and distro logic.
# Fedora: CUDA repo uses fedora-{ver} naming; RPM Fusion nonfree nvidia-driver.
# AlmaLinux: CUDA repo uses rhel{ver} naming; RPM Fusion EL; ELRepo for kmod-nvidia.

_is_fedora: "{{ ansible_distribution == 'Fedora' }}"
_distro_version: "{{ osbuild_distro | regex_replace('^[a-z]+-', '') }}"
# Major version only (e.g. "10"): distribution-gpg-keys, RPM Fusion EL,
# NVIDIA CUDA (rhel*), and Docker CE publish per-major artifacts. AlmaLinux
# metalinks and EPEL point-release paths use the full _distro_version.
_distro_major_version: "{{ _distro_version | regex_replace('\\..*', '') }}"

_nvidia_sources: >-
  {{ _is_fedora | ternary(
    [
      'rpmfusion-nonfree-nvidia-driver',
      'cuda-fedora' + _distro_version + '-' + osbuild_arch,
      'nvidia-container-toolkit',
    ],
    [
      'rpmfusion-nonfree-nvidia-driver',
      'cuda-el' + _distro_major_version + '-x86_64',
      'nvidia-container-toolkit',
    ]
  ) }}

_nvidia_bootc_repos: "{{ _is_fedora | ternary(_nvidia_bootc_repos_fedora, _nvidia_bootc_repos_el) }}"

_nvidia_bootc_repos_fedora:
  - |
    cat > /etc/yum.repos.d/rpmfusion-nonfree-nvidia-driver.repo << 'REPOEOF'
    [rpmfusion-nonfree-nvidia-driver]
    name=RPM Fusion for Fedora {{ _distro_version }} - Nonfree - NVIDIA Driver
    baseurl=http://download1.rpmfusion.org/nonfree/fedora/nvidia-driver/{{ _distro_version }}/{{ osbuild_arch }}/
    enabled=1
    type=rpm-md
    gpgcheck=1
    gpgkey=https://rpmfusion.org/keys/RPM-GPG-KEY-rpmfusion-nonfree-fedora-2020
    REPOEOF
  - |
    cat > /etc/yum.repos.d/nvidia-cuda.repo << 'REPOEOF'
    [cuda-fedora{{ _distro_version }}-{{ osbuild_arch }}]
    name=CUDA for Fedora {{ _distro_version }}
    baseurl=https://developer.download.nvidia.com/compute/cuda/repos/fedora{{ _distro_version }}/{{ osbuild_arch }}/
    enabled=1
    gpgcheck=1
    gpgkey=https://developer.download.nvidia.com/compute/cuda/repos/fedora{{ _distro_version }}/{{ osbuild_arch }}/1940C73E.pub
    REPOEOF
  - |
    cat > /etc/yum.repos.d/nvidia-container-toolkit.repo << 'REPOEOF'
    [nvidia-container-toolkit]
    name=NVIDIA Container Toolkit
    baseurl=https://nvidia.github.io/libnvidia-container/stable/rpm/{{ osbuild_arch }}/
    enabled=1
    gpgcheck=1
    gpgkey=https://nvidia.github.io/libnvidia-container/gpgkey
    REPOEOF

# EL-family bootc NVIDIA repos (AlmaLinux and Rocky fall through to this
# branch via the _is_fedora ternary above — same rhel-path CUDA and ELRepo
# treatment for both). Name is `_el`, not `_almalinux`: the repo set is
# identical for every EL-family distro. Rocky bootc builds remain
# unverified and undocumented (deferred to a follow-up goal); only the
# variable name was generalized here.
_nvidia_bootc_repos_el:
  - |
    cat > /etc/yum.repos.d/rpmfusion-nonfree-nvidia-driver.repo << 'REPOEOF'
    [rpmfusion-nonfree-nvidia-driver]
    name=RPM Fusion for EL {{ _distro_version }} - Nonfree - NVIDIA Driver
    baseurl=http://download1.rpmfusion.org/nonfree/el/nvidia-driver/{{ _distro_version }}/{{ osbuild_arch }}/
    enabled=1
    type=rpm-md
    gpgcheck=1
    gpgkey=https://rpmfusion.org/keys/RPM-GPG-KEY-rpmfusion-nonfree-fedora-2020
    REPOEOF
  - |
    cat > /etc/yum.repos.d/nvidia-cuda.repo << 'REPOEOF'
    [cuda-el{{ _distro_major_version }}-x86_64]
    name=CUDA for EL {{ _distro_major_version }}
    baseurl=https://developer.download.nvidia.com/compute/cuda/repos/rhel{{ _distro_major_version }}/x86_64/
    enabled=1
    gpgcheck=1
    gpgkey=https://developer.download.nvidia.com/compute/cuda/repos/rhel{{ _distro_major_version }}/x86_64/CDF6BA43.pub
    REPOEOF
  - |
    cat > /etc/yum.repos.d/nvidia-container-toolkit.repo << 'REPOEOF'
    [nvidia-container-toolkit]
    name=NVIDIA Container Toolkit
    baseurl=https://nvidia.github.io/libnvidia-container/stable/rpm/{{ osbuild_arch }}/
    enabled=1
    gpgcheck=1
    gpgkey=https://nvidia.github.io/libnvidia-container/gpgkey
    REPOEOF

# =============================================================================
# Component Selection — Primary Interface
# =============================================================================
# Selected components define which packages, services, sources, kernel args,
# and files are included in both traditional ISO (OSBuild) and bootc images.
# Add/remove components to customize the build output.
#
# Available components:
#   base              — Core system (kernel, systemd, NetworkManager, etc.)
#   anaconda          — Anaconda installer (ISO builds only, not bootc)
#   gnome             — GNOME desktop environment + GDM
#   sway              — Sway tiling window manager
#   nvidia            — NVIDIA proprietary driver + CUDA stack
#   development       — GCC, Python, Node.js, rbenv + ruby-build, CMake, Git
#   container-tools   — Podman, Buildah, Skopeo, podman-compose
#   oneapi            — Intel oneAPI BaseKit + HPCKit (adds ~15GB ISO)
#   cli-tools         — Modern CLI utilities (fd, dust, zoxide, micro, etc.)
#   cockpit           — Cockpit web-based system management
#   docker            — Docker CE (experimental)

osbuild_components:
  - base
  - anaconda
  - gnome
  - sway
  - nvidia
  - development
  - container-tools

# =============================================================================
# Component Definitions
# =============================================================================
# Each component defines what gets included when it's selected.
#
# Schema (all fields are lists; use [] when not applicable):
#   label:                Human-readable name (string)
#   packages:             Package name list or Jinja2 expression resolving to list
#   blueprint_groups:     DNF group names (list)
#   services:             Systemd services to enable (list)
#   kernel_args:          Kernel command-line arguments (list of strings)
#   sources:              Repository sources required (list)
#   files:                Custom file payloads (list)
#   flatpaks:             Flatpak application IDs (list)
#   copr_repos:           COPR repository names (list)
#   bootc_repos:          Shell commands to add repos in bootc builds (list)
#   requires:             Component names this component depends on (list)
#   conflicts:            Component names this component conflicts with (list)
#   size_impact:          Estimated ISO size impact — "none", "small", "medium", "large"
#   build_time_impact:    Estimated build time impact — "none", "low", "medium", "high"
#   secure_boot_compatible: Boolean flag for Secure Boot support
#   bootc_only:           If true, component only applies to bootc builds (bool)
#   blueprint_only:       If true, component only applies to ISO builds (bool)

osbuild_component_defs:
  base:
    label: "Base Workstation"
    packages: "{{ system_packages.System.kernel + system_packages.System.base + system_packages.System.networking + system_packages.System.ansible }}"
    blueprint_groups: "{{ system_groups.base }}"
    services:
      - chronyd
      - firewalld
      - NetworkManager
      - sshd
    kernel_args: []
    sources: []
    files: []
    flatpaks: []
    copr_repos: []
    bootc_repos: []
    requires: []
    conflicts: []
    size_impact: "small"
    build_time_impact: "none"
    secure_boot_compatible: true
    bootc_only: false
    blueprint_only: false

  anaconda:
    label: "Anaconda Installer"
    packages: "{{ system_packages.System.installer }}"
    blueprint_groups: []
    services: []
    kernel_args: []
    sources: []
    files: []
    flatpaks: []
    copr_repos: []
    bootc_repos: []
    requires:
      - base
    conflicts: []
    size_impact: "medium"
    build_time_impact: "low"
    secure_boot_compatible: true
    bootc_only: false
    blueprint_only: true

  gnome:
    label: "GNOME Desktop"
    packages: "{{ system_packages.Settings.gnome + system_packages.Utility.xdg }}"
    blueprint_groups: []
    services:
      - gdm
    kernel_args: []
    sources: []
    files: []
    flatpaks: []
    copr_repos: []
    bootc_repos: []
    requires:
      - base
    conflicts: []
    size_impact: "medium"
    build_time_impact: "low"
    secure_boot_compatible: true
    bootc_only: false
    blueprint_only: false

  nvidia:
    label: "NVIDIA GPU Stack"
    packages: "{{ system_packages.Graphics.nvidia }}"
    blueprint_groups: []
    services:
      - nvidia-cdi-refresh
      - nvidia-persistenced
    kernel_args:
      - "rd.driver.blacklist=nouveau"
      - "modprobe.blacklist=nouveau"
      - "nvidia-drm.modeset=1"
      - "DRACUT_NO_XATTR=1"
    sources: "{{ _nvidia_sources }}"
    files: []
    flatpaks: []
    copr_repos: []
    bootc_repos: "{{ _nvidia_bootc_repos }}"
    requires:
      - base
    conflicts: []
    size_impact: "large"
    build_time_impact: "medium"
    secure_boot_compatible: false
    bootc_only: false
    blueprint_only: false

  sway:
    label: "Sway Window Manager"
    packages: >-
      {{
        system_packages.Settings.sway_core +
        system_packages.Settings.sway_integration +
        system_packages.Settings.sway_wayland +
        system_packages.Settings.sway_launchers +
        system_packages.Settings.sway_ui +
        system_packages.Settings.sway_utils +
        system_packages.Settings.sway_python +
        system_packages.Utility.shell
      }}
    blueprint_groups: []
    services: []
    kernel_args: []
    sources: []
    files: []
    flatpaks: []
    copr_repos: []
    bootc_repos: []
    requires:
      - base
    conflicts: []
    size_impact: "small"
    build_time_impact: "low"
    secure_boot_compatible: true
    bootc_only: false
    blueprint_only: false

  development:
    label: "Development Tools"
    packages: >-
      {{ system_packages.Development.compilers + system_packages.Development.languages
      + system_packages.Development.vcs + system_packages.Development.rpm_build }}
    blueprint_groups:
      - development-tools
      - c-development
    services: []
    kernel_args: []
    sources: []
    files: []
    flatpaks: "{{ system_flatpaks.development }}"
    copr_repos: []
    bootc_repos: []
    requires:
      - base
    conflicts: []
    size_impact: "medium"
    build_time_impact: "medium"
    secure_boot_compatible: true
    bootc_only: false
    blueprint_only: false

  container-tools:
    label: "Container Tools"
    packages: "{{ system_packages.System.podman + system_packages.System.docker }}"
    blueprint_groups:
      - container-management
    services: []
    kernel_args: []
    sources:
      - docker-ce-stable
    files: []
    flatpaks: "{{ system_flatpaks.development }}"
    copr_repos: []
    bootc_repos: []
    requires:
      - base
    conflicts: []
    size_impact: "small"
    build_time_impact: "low"
    secure_boot_compatible: true
    bootc_only: false
    blueprint_only: false

  oneapi:
    label: "Intel oneAPI"
    packages: "{{ system_packages.Development.basekit + system_packages.Development.hpckit }}"
    blueprint_groups: []
    services: []
    kernel_args: []
    sources:
      - intel-oneapi
    files: []
    flatpaks: []
    copr_repos: []
    bootc_repos: []
    requires:
      - base
    conflicts: []
    size_impact: "large"
    build_time_impact: "high"
    secure_boot_compatible: true
    bootc_only: false
    blueprint_only: false

  cli-tools:
    label: "Modern CLI Tools"
    packages: "{{ system_packages.Utility.cli_modern + system_packages.Utility.shell + system_packages.Utility.tools }}"
    blueprint_groups: []
    services: []
    kernel_args: []
    sources: []
    files: []
    flatpaks: []
    copr_repos: "{{ system_copr_repos.tools }}"
    bootc_repos: []
    requires:
      - base
    conflicts: []
    size_impact: "small"
    build_time_impact: "none"
    secure_boot_compatible: true
    bootc_only: false
    blueprint_only: false

  cockpit:
    label: "Cockpit Management"
    packages: "{{ system_packages.System.cockpit }}"
    blueprint_groups: []
    services:
      - cockpit.socket
    kernel_args: []
    sources: []
    files: []
    flatpaks: []
    copr_repos: []
    bootc_repos: []
    requires:
      - base
    conflicts: []
    size_impact: "small"
    build_time_impact: "none"
    secure_boot_compatible: true
    bootc_only: false
    blueprint_only: false

  # =============================================================================
  # Component Aliases (for backward compatibility with README examples)
  # =============================================================================
  # TODO: These aliases duplicate their target definitions and will drift.
  # Refactor to use alias_of + combine() merge pattern. See:
  #   - core → base (pure alias)
  #   - desktop → gnome + overrides (preset pattern: conflicts, extra flatpaks)
  #   - audio, virtualization (standalone components, not true aliases)

  core:
    label: "Base Workstation (alias for 'base')"
    packages: "{{ system_packages.System.kernel + system_packages.System.base + system_packages.System.networking + system_packages.System.ansible }}"
    blueprint_groups: "{{ system_groups.base }}"
    services:
      - chronyd
      - firewalld
      - NetworkManager
      - sshd
    kernel_args: []
    sources: []
    files: []
    flatpaks: []
    copr_repos: []
    bootc_repos: []
    requires: []
    conflicts: []
    size_impact: "small"
    build_time_impact: "none"
    secure_boot_compatible: true
    bootc_only: false
    blueprint_only: false

  desktop:
    label: "GNOME Desktop (alias for 'gnome')"
    packages: "{{ system_packages.Settings.gnome + system_packages.Utility.xdg }}"
    blueprint_groups: []
    services:
      - gdm
    kernel_args: []
    sources: []
    files: []
    flatpaks: "{{ system_flatpaks.system + system_flatpaks.productivity }}"
    copr_repos: []
    bootc_repos: []
    requires:
      - base
    conflicts:
      - sway
    size_impact: "medium"
    build_time_impact: "low"
    secure_boot_compatible: true
    bootc_only: false
    blueprint_only: false

  audio:
    label: "Audio Production Tools"
    packages: >-
      {{ system_packages.AudioVideo.tuning + system_packages.AudioVideo.pipewire
         + system_packages.AudioVideo.applications + system_packages.AudioVideo.plugins }}
    blueprint_groups: "{{ system_groups.audio }}"
    services: []
    kernel_args: []
    sources: []
    files: []
    flatpaks: "{{ system_flatpaks.media }}"
    copr_repos: "{{ system_copr_repos.audio }}"
    bootc_repos: []
    requires:
      - base
    conflicts: []
    size_impact: "medium"
    build_time_impact: "medium"
    secure_boot_compatible: true
    bootc_only: false
    blueprint_only: false

  virtualization:
    label: "Virtualization Stack"
    packages: "{{ system_packages.System.libvirt + system_packages.System.qemu + system_packages.System.tools + system_packages.System.network }}"
    blueprint_groups: []
    services:
      - libvirtd
    kernel_args: []
    sources: []
    files: []
    flatpaks: []
    copr_repos: []
    bootc_repos: []
    requires:
      - base
    conflicts: []
    size_impact: "medium"
    build_time_impact: "medium"
    secure_boot_compatible: true
    bootc_only: false
    blueprint_only: false

# =============================================================================
# Build Host Configuration
# =============================================================================

# Packages to install on the build host
osbuild_host_packages:
  Fedora:
    - osbuild
    - image-builder
    - bash-completion
    - firewalld
    - openscap-scanner
    - scap-security-guide
    - python3-tomli
  AlmaLinux:
    - osbuild
    - image-builder
    - bash-completion
    - firewalld
    - openscap-scanner
    - scap-security-guide
    - python3-tomli
  # Rocky ships the same EL package set as AlmaLinux (verified against
  # Rocky 9/10 AppStream repodata, 2026-10-01).
  Rocky:
    - osbuild
    - image-builder
    - bash-completion
    - firewalld
    - openscap-scanner
    - scap-security-guide
    - python3-tomli

# Build timeout in seconds (default: 4 hours for oneAPI builds)
# [COMPATIBILITY] Retained for backward compatibility.
# Deprecated: composer orchestration cadence variables retained because some callers still import them.
osbuild_build_timeout: 14400

# Number of build retry attempts on failure
# [COMPATIBILITY] Retained for backward compatibility.
# Deprecated: composer orchestration cadence variables retained because some callers still import them.
osbuild_build_retries: 1

# =============================================================================
# Repository Sources
# =============================================================================

# Repository sources derived from selected components
# Each component can define its required sources.
# Common sources are always included (distro-specific):
osbuild_distro_sources_fedora:
  - rpmfusion-free
  - rpmfusion-free-updates
  - rpmfusion-nonfree
  - rpmfusion-nonfree-updates
  - vscode
  - google-chrome

# EL-family (AlmaLinux, Rocky) common sources. Both distros share the EL
# repo topology — EPEL, RPM Fusion EL updates-only channels, VS Code,
# Google Chrome — so one list serves both; per-distro URLs and GPG keys
# live in vars/AlmaLinux.yml and vars/Rocky.yml.
osbuild_distro_sources_el:
  - epel
  - rpmfusion-free-updates
  - rpmfusion-nonfree-updates
  - vscode
  - google-chrome

# Extra repository URLs passed to image-builder as --extra-repo, in addition
# to the URLs derived from osbuild_sources (tasks/sources.yml merges both).
# image-builder depsolves only against base repos and these; a repo listed
# only in a blueprint's [[customizations.repositories]] is not used for
# package resolution.
osbuild_extra_repo_urls: []

# Repository names (keys of vars/<build host distribution>.yml `repo`) turned
# into --extra-repo URLs: the host distribution's common list plus the sources
# of each selected component (osbuild_component_defs). Set [] when the target
# distro differs from the build host's (e.g. a Rocky image built on Fedora)
# and list the target's repos in osbuild_extra_repo_urls instead.
osbuild_sources: >-
  {{ (ansible_distribution == 'Fedora') | ternary(osbuild_distro_sources_fedora,
  osbuild_distro_sources_el) + (osbuild_component_sources | default([])) }}

# Optional sources (uncomment to add manually):
# - docker-ce
# - vscode
# - google-chrome

# =============================================================================
# Blueprint Configuration
# =============================================================================

# Use dynamic Jinja2 template (true) or static blueprint file (false)
# [COMPATIBILITY] Retained for backward compatibility.
# Deprecated: composer blueprint templating retained to support both static and dynamic
# blueprint workflows during migration.
osbuild_use_blueprint_template: true

# Path to static blueprint file (used when osbuild_use_blueprint_template: false)
# [COMPATIBILITY] Retained for backward compatibility.
# Deprecated: composer blueprint templating retained to support both static and dynamic
# blueprint workflows during migration.
osbuild_static_blueprint_path: >-
  {{ 'files/' ~ (ansible_distribution | lower) ~ '/' ~
  (osbuild_distro | regex_replace('^[a-z]+-', '')) ~ '/' ~ osbuild_arch ~
  '/workstation/' ~ osbuild_distro ~ '-workstation-nvidia.toml' }}

# Component-composed blueprint. When non-empty this takes precedence over both
# osbuild_use_blueprint_template and osbuild_static_blueprint_path: the role
# merges the named component files (packages, services, kernel args, repo URLs,
# optional TOML fragment) with a static frame into one blueprint, and adds each
# component's repo_urls to --extra-repo. Component files live in
# files/<target distro>/<major>/<arch>/components/<name>.yml; paths below are
# relative to the role's files/ directory and follow osbuild_distro (the
# target), not the build host.
osbuild_blueprint_components: []
osbuild_components_dir: >-
  {{ osbuild_target_distribution | lower }}/{{ _distro_major_version }}/{{ osbuild_arch }}/components
# Static, non-composable blueprint part (firewall, locale, timezone, files).
osbuild_blueprint_frame_path: >-
  {{ osbuild_target_distribution | lower }}/{{ _distro_major_version }}/{{ osbuild_arch }}/frames/workstation.toml

# Template path (used when osbuild_use_blueprint_template: true)
# [COMPATIBILITY] Retained for backward compatibility.
# Deprecated: composer blueprint templating retained to support both static and dynamic
# blueprint workflows during migration.
osbuild_blueprint_template: "blueprint.toml.j2"

# =============================================================================
# User Customization
# =============================================================================

# Default user account to create
osbuild_user_name: "osadmin"
osbuild_user_description: "Ansible User"
osbuild_user_password: "$6$PHHYWL.kMffMRnd.$AVI7wxwSAHG.mUu3cI7QbW/zItvc/mqn0IM7RJNufD3jPUtoGzhZ5NJZJqJ6VEoP4alRRGXOejr6jw4OoBWSj/"
osbuild_user_groups:
  - wheel
  - libvirt

# SSH public key for default user
osbuild_user_ssh_key: ""

# Hostname for the installed system
osbuild_hostname: "workstation"

# Timezone
osbuild_timezone: "America/New_York"

# Keyboard layout
osbuild_keyboard: "us"

# Locale
osbuild_locale: "en_US.UTF-8"

# =============================================================================
# Package Selection
# =============================================================================
# Package lists are defined in vars/packages/{Distribution}.yml for easier maintenance.
# The legacy flat lists (osbuild_sway_packages, osbuild_nvidia_packages, etc.)
# have been absorbed into the canonical taxonomy under osbuild_legacy.* in each
# distribution file. Component definitions reference system_packages.* directly.

# Additional packages to include beyond component defaults
osbuild_extra_packages:
  []
  # - vim-enhanced
  # - tmux
  # - htop

# Per-package version pins, keyed by package name. Empty = every package
# resolves to "*" (latest available). Override in group_vars or host_vars to
# pin for a class of machines (e.g. a VFX-standard workstation profile) —
# Ansible variable precedence (defaults < group_vars < host_vars) does the
# override work; blueprints and taxonomy never carry versions.
# Value is an image-builder blueprint version expression, e.g.:
#   osbuild_package_pins:
#     python3: "3.11.*"
#     cuda-toolkit: "13-4.*"
# Only consumed by the Jinja2 blueprint templates (packages loop); static
# blueprint files always build with "*".
osbuild_package_pins: {}

# =============================================================================
# Service Configuration
# =============================================================================
# Services are derived from osbuild_component_defs[].services for each
# component in osbuild_components. See build.sh.j2 and fedora-workstation.toml.j2.

# =============================================================================
# Output Configuration
# =============================================================================

# Directory to store final ISO/image
osbuild_output_dir: "/var/tmp/osbuild-images"

# =============================================================================
# First-Login Splash
# =============================================================================

# Append files/firstboot/ (syncopated-firstboot, its launcher, and the XDG
# autostart entry) to every prepared blueprint. At first graphical login it
# clones a dotfiles repository with yadm and runs `yadm bootstrap`.
osbuild_firstboot_enabled: true

# Append files/flatpak/flathub.flatpakrepo to every prepared blueprint as
# /etc/flatpak/remotes.d/flathub.flatpakrepo. flatpak imports it as the
# system remote "flathub" (GNOME Software lists it). The flatpak package must
# come from the blueprint (the GNOME/workstation groups pull it in).
# Refresh the file from https://dl.flathub.org/repo/flathub.flatpakrepo when
# Flathub rotates its signing key (current key expires 2027-06-14).
osbuild_flathub_enabled: true

# Append /etc/syncopated-release to every prepared blueprint: the blueprint
# name, target distro and the commit of this repository that produced it, so
# `cat /etc/syncopated-release` on an installed system names its source.
osbuild_release_file_enabled: true
# Short HEAD hash with a "-dirty" suffix for uncommitted changes; "unknown"
# when the role does not run from a git checkout. Lookups run on the controller.
osbuild_release_commit: >-
  {{ lookup('ansible.builtin.pipe',
     'git -C ' ~ (role_path | quote) ~ ' describe --always --abbrev=7 --dirty --exclude "*" 2>/dev/null || echo unknown') }}

# Append files/kickstart/syncopated.ks to every prepared blueprint as
# [customizations.installer.kickstart]. Anaconda then asks only for the root
# password and the user; %pre picks the target disk and lays it out. Blueprints
# must not carry [[customizations.user]], [[customizations.group]], unattended
# or sudo-nopasswd while this is on: image-builder rejects them next to a kickstart.
osbuild_kickstart_enabled: true

# How the installer kickstart handles disks:
#   auto        — files/kickstart/syncopated.ks: %pre picks the target disk and
#                 writes the vg00 layout; no storage screen.
#   interactive — files/kickstart/syncopated-interactive.ks: no storage
#                 commands; Anaconda's Installation Destination screen must be
#                 completed by the user.
osbuild_kickstart_partitioning: auto
osbuild_kickstart_file: "kickstart/{{ 'syncopated-interactive.ks' if osbuild_kickstart_partitioning == 'interactive' else 'syncopated.ks' }}"

# Disk layout for osbuild_kickstart_partitioning: auto. All logical volumes
# are XFS in vg00 on the selected disk. Usable space = disk size - 4 GiB
# (/boot, EFI partition, LVM metadata). Order of allocation:
#   1. /      root_percent of the usable space, at least root_min_gib
#   2. spare  reserve_percent of the usable space stays unassigned in vg00,
#             so a full volume can be grown with `lvextend -r` (README:
#             "When a volume fills up")
#   3. /usr   usr_percent of what is left, at most usr_max_gib
#      /var   the rest of it (what /usr's cap leaves over), at most var_max_gib
#   4. /home  everything above the two caps, if that is at least
#             home_min_gib; otherwise it also stays unassigned and /home is
#             a directory on /
# Disks smaller than disk_min_gib abort the install with a message on tty1.
# XFS cannot shrink: prefer caps that are too small (grow later) over too large.
osbuild_kickstart_disk_min_gib: 40
osbuild_kickstart_root_percent: 10
osbuild_kickstart_root_min_gib: 16
osbuild_kickstart_reserve_percent: 10
osbuild_kickstart_usr_percent: 80
osbuild_kickstart_usr_max_gib: 256
osbuild_kickstart_var_max_gib: 128
osbuild_kickstart_home_min_gib: 100

# Ship /etc/sudoers.d/90-wheel-nopasswd (%wheel ALL=(ALL) NOPASSWD: ALL) so the
# admin user created in Anaconda runs sudo without a password.
osbuild_kickstart_sudoers: true

# [COMPATIBILITY] Retained for backward compatibility.
# Deprecated: composer-era output naming convention carried over for backward compatibility.
# Filename for the final image (UUID will be prepended)
osbuild_output_filename: "{{ osbuild_blueprint_name }}-{{ osbuild_distro }}.iso"

# Tag for container image types (container, container-minimal): the generated
# build script loads the OCI archive into podman and applies this tag.
osbuild_container_tag: "localhost/{{ osbuild_blueprint_name }}:latest"

# Distro-specific osbuild-composer repository config template
# Major-version based: the template tree is files/almalinux/10/... and
# files/rocky/10/..., so a point-release osbuild_distro (almalinux-10.2,
# rocky-10.2) must resolve to the major-only template name.
osbuild_repo_config_template: "{{ ansible_distribution | lower }}-{{ _distro_major_version }}.json.j2"

# Keep build logs on failure
# [COMPATIBILITY] Retained for backward compatibility.
# Deprecated: composer-era log-retention behavior kept for backward compatibility.
osbuild_keep_logs: true

# Log directory
osbuild_log_dir: "/var/tmp/osbuild-logs"

# =============================================================================
# Advanced Configuration
# =============================================================================

# Path to osbuild work directory
osbuild_work_dir: "/var/lib/osbuild-composer"

# Directory to cache fetched gpgkey files (used by tasks/repo_keys.yml)
osbuild_gpgkey_cache_dir: "{{ osbuild_work_dir }}/gpgkeys"

# Minimum free disk space required (in GB)
osbuild_min_disk_space: 50

# Enable verbose output
osbuild_verbose: false

# =============================================================================
# bootc Configuration (Container-Based OS Images)
# =============================================================================

# bootc container image name (without tag)
osbuild_bootc_image_name: "quay.io/syncopated/{{ osbuild_blueprint_name }}"

# bootc container image tag
osbuild_bootc_image_tag: "latest"

# bootc workspace directory for Containerfile and build files
osbuild_bootc_workspace: "/tmp/bootc-workspace"

# bootc base image to build from
# Options:
#   - quay.io/fedora/fedora-bootc:43 (Fedora bootc base)
#   - ghcr.io/ublue-os/bazzite:stable (Universal Blue Bazzite)
#   - ghcr.io/ublue-os/aurora:stable (Universal Blue Aurora - KDE)
#   - ghcr.io/ublue-os/bluefin:stable (Universal Blue Bluefin - GNOME)
#   - ghcr.io/ublue-os/base-main:latest (Universal Blue Base)
osbuild_bootc_base_image: "quay.io/fedora/fedora-bootc:43"

# Build bootable disk image from container (qcow2/ISO)
osbuild_bootc_build_disk_image: false

# bootc disk image type (qcow2, iso, raw)
osbuild_bootc_image_type: "qcow2"

# Root filesystem type (btrfs, ext4, xfs)
osbuild_bootc_rootfs: "btrfs"

# bootc output directory for built disk images
osbuild_bootc_output_dir: "{{ osbuild_output_dir }}/bootc"

# bootc build timeout (in seconds) - disk image builds can take longer
osbuild_bootc_build_timeout: 7200 # 2 hours

# Enable Podman socket (required for bootc container builds)
osbuild_bootc_enable_podman_socket: true

# =============================================================================
# Ansible Role Inversion Pattern — Build-time Configuration
# =============================================================================
# These variables control build-time Ansible playbook execution in the Containerfile
# The playbook compiles configurations into /usr/etc (immutable vendor defaults)

# Include fstab in /usr/etc (typically handled by bootc disk config instead)
osbuild_include_fstab: false

# Kernel command line snippets (list of {name, cmdline} dicts)
# Example:
# osbuild_kernel_cmdline_snippets:
#   - name: "quiet"
#     cmdline: "quiet splash"
#   - name: "custom"
#     cmdline: "custom.param=value"
osbuild_kernel_cmdline_snippets: []
