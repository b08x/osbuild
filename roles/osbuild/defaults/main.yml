# SPDX-License-Identifier: MIT-0
---
# defaults file for osbuild

# =============================================================================
# Build Configuration
# =============================================================================

# Distribution version (e.g., "fedora-43", "almalinux-10.2", "rocky-10.2")
# EL distro names are point releases on the installed image-builder binary
# (live `image-builder list` knows almalinux-9.8/10.2 and rocky-9.8/10.2;
# major-only names do not resolve). See playbooks/osbuild.yml for the
# default resolution per build host.
osbuild_distro: "fedora-43"

# Distribution whose component directory (files/<name>/<major>/<arch>/) supplies
# component files and frames. Derived from the TARGET (osbuild_distro), not the
# build host, so an EL 10 build on a Fedora host gets EL package names.
# Unknown prefixes fall back to the host distribution.
osbuild_target_distribution: >-
  {{ {'fedora': 'Fedora', 'rocky': 'Rocky', 'almalinux': 'AlmaLinux'}
     .get(osbuild_distro.split('-')[0], ansible_distribution | default('Fedora')) }}

# JSON Schema for build intents (tasks/intent.yml, playbooks/build.yml).
osbuild_intent_schema: "{{ role_path }}/../../schema/intent.schema.json"

# Architecture (x86_64, aarch64)
osbuild_arch: "x86_64"

# [COMPATIBILITY] Retained for backward compatibility.
# Deprecated: composer-era naming kept to avoid breaking existing inventory and playbooks.
# Migration guidance: prefer the component/image-builder equivalents where possible.
# Blueprint name (will be used for compose and output files)
osbuild_blueprint_name: "custom"

# [COMPATIBILITY] Retained for backward compatibility.
# Deprecated: composer-era blueprint metadata kept for compatibility.
# Blueprint version
osbuild_blueprint_version: "1.0.0"

# [COMPATIBILITY] Retained for backward compatibility.
# Deprecated: composer-era blueprint metadata kept for compatibility.
# Blueprint description
osbuild_blueprint_description: "Custom Workstation"

# Image type for image-builder
# [COMPATIBILITY] Retained for backward compatibility.
# Deprecated: composer-era concept; retained because existing tasks, playbooks, and tests
# still reference `osbuild_image_type`. Migration guidance: keep overriding this variable
# until every consumer migrates to the image-builder CLI type mapping.
# Live `image-builder list` (tinybot, AlmaLinux 10.2 build host, 2026-10-01):
# `minimal-installer` exists only for Fedora (fedora-42 through 45); EL
# distros (almalinux-*, rocky-*) build installer images as `image-installer`
# or `network-installer`. Other options: qcow2, ami, vhd, vmdk.
osbuild_image_type: "{{ 'minimal-installer' if ansible_distribution == 'Fedora' else 'image-installer' }}"

# Default: prepare the blueprint and write build-<blueprint>.sh next to it in
# osbuild_output_dir, without running image-builder. Run that script on the
# build host to build the image. Set false (-e osbuild_only_generate=false) to
# build inside the play. Ignored when osbuild_build_bootc is true.
osbuild_only_generate: true

# Build bootc container image (alternative to traditional ISO)
# When true, creates a bootc container image for atomic OS updates
osbuild_build_bootc: false

# =============================================================================
# Target Version Helpers
# =============================================================================

_osbuild_distro_version: "{{ osbuild_distro | regex_replace('^[a-z]+-', '') }}"
# Major version only (e.g. "10"): distribution-gpg-keys, RPM Fusion EL,
# NVIDIA CUDA (rhel*), and Docker CE publish per-major artifacts. AlmaLinux
# metalinks and EPEL point-release paths use the full _osbuild_distro_version.
_osbuild_distro_major_version: "{{ _osbuild_distro_version | regex_replace('\\..*', '') }}"

# =============================================================================
# Component File Schema
# =============================================================================
# Component files are the only package data. A build selects them by name with
# osbuild_blueprint_components (see Blueprint Configuration below); each name
# is a file files/<distro>/<major>/<arch>/components/<name>.yml.
#
# Fields:
#   label:        Human-readable name (string, required)
#   packages:     Package names (list, required, non-empty). Names starting
#                 with @ are comps groups. Never pin versions here; use
#                 osbuild_package_pins.
#   repo_urls:    Repository URLs passed to image-builder as --extra-repo
#                 (list). image-builder depsolves only against its base repos
#                 and these.
#   services:     Systemd services to enable (list)
#   kernel_args:  Kernel command-line arguments (list of strings)
#   fragment:     Name of a TOML file in the same directory, appended verbatim
#                 to the blueprint (string; array-of-tables only)
#   flatpaks:     Flatpak application IDs installed by bootc builds (list)
#   bootc_repos:  Shell snippets that add repositories in bootc builds (list)
#   copr_repos:   COPR repositories enabled in bootc builds (list)
#   user_groups:  Supplementary groups the installer users join when the
#                 component is selected, e.g. libvirt (list; the groups must
#                 be created by the component's packages or the base system)
#   openscap_unselected: Rule IDs (suffix after content_rule_) unselected in
#                 the OpenSCAP tailoring of an openscap-* component (list)
#
# All list fields except label and packages are optional. scripts/package_tracker.py
# lists, searches, adds and removes packages in these files.

# =============================================================================
# Build Host Configuration
# =============================================================================

# Packages to install on the build host
osbuild_host_packages:
  Fedora:
    - osbuild
    - image-builder
    - bash-completion
    - firewalld
    - openscap-scanner
    - scap-security-guide
    - python3-tomli
  AlmaLinux:
    - osbuild
    - image-builder
    - bash-completion
    - firewalld
    - openscap-scanner
    - scap-security-guide
    - python3-tomli
  # Rocky ships the same EL package set as AlmaLinux (verified against
  # Rocky 9/10 AppStream repodata, 2026-10-01).
  Rocky:
    - osbuild
    - image-builder
    - bash-completion
    - firewalld
    - openscap-scanner
    - scap-security-guide
    - python3-tomli

# Build timeout in seconds (default: 4 hours for oneAPI builds)
# [COMPATIBILITY] Retained for backward compatibility.
# Deprecated: composer orchestration cadence variables retained because some callers still import them.
osbuild_build_timeout: 14400

# Number of build retry attempts on failure
# [COMPATIBILITY] Retained for backward compatibility.
# Deprecated: composer orchestration cadence variables retained because some callers still import them.
osbuild_build_retries: 1

# =============================================================================
# Repository Sources
# =============================================================================

# Repository sources derived from selected components
# Each component can define its required sources.
# Common sources are always included (distro-specific):
osbuild_distro_sources_fedora:
  - rpmfusion-free
  - rpmfusion-free-updates
  - rpmfusion-nonfree
  - rpmfusion-nonfree-updates
  - vscode
  - google-chrome
  - syncopated

# EL-family (AlmaLinux, Rocky) common sources. Both distros share the EL
# repo topology — EPEL, RPM Fusion EL updates-only channels, VS Code,
# Google Chrome — so one list serves both; per-distro URLs and GPG keys
# live in vars/AlmaLinux.yml and vars/Rocky.yml.
osbuild_distro_sources_el:
  # Rocky CRB, Plus and RT. Names absent from the host's `osbuild_repo` dictionary
  # (e.g. on an AlmaLinux host) are skipped by tasks/sources.yml.
  - rocky-crb
  - rocky-plus
  - rocky-rt
  - epel
  - rpmfusion-free-updates
  - rpmfusion-nonfree-updates
  - vscode
  - google-chrome
  - syncopated

# Extra repository URLs passed to image-builder as --extra-repo, in addition
# to the URLs derived from osbuild_sources (tasks/sources.yml merges both).
# image-builder depsolves only against base repos and these; a repo listed
# only in a blueprint's [[customizations.repositories]] is not used for
# package resolution.
osbuild_extra_repo_urls: []

# Repository names (keys of vars/<build host distribution>.yml `osbuild_repo`) turned
# into --extra-repo URLs: the host distribution's common list. Selected
# components add their own repo_urls (tasks/components.yml). Derived, never
# set by an intent: empty when the target family (Fedora vs EL) differs from
# the build host's (e.g. a Rocky image built on Fedora), because the list and
# its URLs describe the host; the components' repo_urls then supply the
# target's repos.
osbuild_sources: >-
  {{ []
     if ((ansible_distribution == 'Fedora') != (osbuild_target_distribution == 'Fedora'))
     else ((ansible_distribution == 'Fedora') | ternary(osbuild_distro_sources_fedora,
           osbuild_distro_sources_el)) }}

# Optional sources (uncomment to add manually):
# - docker-ce
# - vscode
# - google-chrome

# =============================================================================
# Blueprint Configuration
# =============================================================================

# Component-composed blueprint. The role merges the named component files
# (packages, services, kernel args, repo URLs, optional TOML fragment) with a
# static frame into one blueprint, and adds each component's repo_urls to
# --extra-repo. Component files live in
# files/<target distro>/<major>/<arch>/components/<name>.yml (schema above);
# paths below are relative to the role's files/ directory and follow
# osbuild_distro (the target), not the build host. This is the only variable
# that selects packages.
osbuild_blueprint_components: []
osbuild_components_dir: >-
  {{ osbuild_target_distribution | lower }}/{{ _osbuild_distro_major_version }}/{{ osbuild_arch }}/components
# Static, non-composable blueprint part (firewall, locale, timezone, files).
# Playbooks that build another image kind point this at another frame, e.g.
# frames/container.toml.
osbuild_blueprint_frame_path: >-
  {{ osbuild_target_distribution | lower }}/{{ _osbuild_distro_major_version }}/{{ osbuild_arch }}/frames/workstation.toml

# Hand-written blueprint copied as is. Used only when
# osbuild_blueprint_components is empty; the path is relative to the role's
# files/ directory and has no default.
osbuild_static_blueprint_path: ""

# =============================================================================
# User Customization
# =============================================================================

# Installer users (kickstart `user` commands), from the intent's `users`. Each
# entry: name, gecos, optional groups, uid and ssh_pubkey. Every user gets
# osbuild_initial_password: only its SHA-512 hash goes into the blueprint, it
# is printed at the end of the play and written to
# <output_dir>/<blueprint>.credentials.txt (mode 0600), and the user must
# choose a new password at first login (chage -d 0). Supplementary groups are
# wheel + the selected components' user_groups + the entry's groups. Root is
# locked unless osbuild_root_enabled; administration is through sudo for wheel.
osbuild_users: []

# Initial password of every installer user (and root when enabled). It is
# known, so it only lasts until the first login, which forces a new one.
osbuild_initial_password: syncopated

# Unlock root (intent `root.enabled`). Root then gets osbuild_initial_password
# and must change it at first login, like the users.
osbuild_root_enabled: false

# Python that runs the play on the controller; it must import passlib to hash
# the generated passwords (tasks/credentials.yml checks first).
osbuild_controller_python: "{{ ansible_playbook_python }}"

# Owner of generated files (blueprint, build script, credentials, ISO).
# playbooks/build.yml sets it to the connecting user.
osbuild_output_owner: ""

# Mode of the blueprint, the build script and the built image. 0600 when
# remote logging is on: the blueprint and the image then carry the client
# private key. The credentials file is always 0600.
osbuild_output_mode: >-
  {{ '0600' if (osbuild_remote_logging | default({})).enabled | default(false) | bool else '0644' }}

# bootc builds only (templates/build.sh.j2): user created in the container image.
osbuild_user_name: "osadmin"
osbuild_user_description: "Ansible User"
osbuild_user_password: "$6$PHHYWL.kMffMRnd.$AVI7wxwSAHG.mUu3cI7QbW/zItvc/mqn0IM7RJNufD3jPUtoGzhZ5NJZJqJ6VEoP4alRRGXOejr6jw4OoBWSj/"
osbuild_user_groups:
  - wheel
  - libvirt

# SSH public key for default user
osbuild_user_ssh_key: ""

# Hostname for the installed system
osbuild_hostname: "workstation"

# Timezone
osbuild_timezone: "America/New_York"

# Keyboard layout
osbuild_keyboard: "us"

# Locale
osbuild_locale: "en_US.UTF-8"

# =============================================================================
# Package Selection
# =============================================================================
# Package lists live in the component files (see "Component File Schema" above).

# Additional packages to include beyond the selected components
osbuild_extra_packages: []
  # - vim-enhanced
  # - tmux
  # - htop

# Per-package version pins, keyed by package name. Empty = every package
# resolves to "*" (latest available). Override in group_vars or host_vars to
# pin for a class of machines (e.g. a VFX-standard workstation profile) —
# Ansible variable precedence (defaults < group_vars < host_vars) does the
# override work; component files never carry versions.
# Value is an image-builder blueprint version expression, e.g.:
#   osbuild_package_pins:
#     python3: "3.11.*"
#     cuda-toolkit: "13-4.*"
# Only consumed by templates/blueprint-components.toml.j2; static blueprint
# files always build with "*".
osbuild_package_pins: {}

# =============================================================================
# Service Configuration
# =============================================================================
# Services come from the `services` field of each selected component file. See
# tasks/components.yml and templates/build.sh.j2.

# =============================================================================
# Output Configuration
# =============================================================================

# Directory to store final ISO/image
osbuild_output_dir: "/var/tmp/osbuild-images"

# =============================================================================
# First-Login Splash
# =============================================================================

# Append files/firstboot/ (syncopated-firstboot, its launcher, and the XDG
# autostart entry) to every prepared blueprint. At first graphical login it
# clones a dotfiles repository with yadm and runs `yadm bootstrap`.
osbuild_firstboot_enabled: true

# Run `ansible-pull` in the first-login splash, right after `dnf upgrade`.
# Active only when osbuild_firstboot_enabled is true and both variables are
# non-empty. The values are written to /etc/syncopated-ansible-pull.conf and
# the splash runs `sudo ansible-pull -U <repo> <args>`.
#   osbuild_ansible_pull_repo: URL of the repository to pull (-U).
#   osbuild_ansible_pull_args: list of arguments, or a string split on
#     whitespace, e.g. ["-C", "main", "-i", "localhost,", "local.yml"].
# The image must contain ansible-core (provides ansible-pull) and git;
# without ansible-pull the splash skips the step.
osbuild_ansible_pull_repo: ""
osbuild_ansible_pull_args: []

# Append files/flatpak/flathub.flatpakrepo to every prepared blueprint as
# /etc/flatpak/remotes.d/flathub.flatpakrepo. flatpak imports it as the
# system remote "flathub" (GNOME Software lists it). The flatpak package must
# come from the blueprint (the GNOME/workstation groups pull it in).
# Refresh the file from https://dl.flathub.org/repo/flathub.flatpakrepo when
# Flathub rotates its signing key (current key expires 2027-06-14).
osbuild_flathub_enabled: true

# Rocky targets only: append the rocky-repos files from
# files/rocky/<major>/<arch>/yum.repos.d/ to every prepared blueprint, so the
# installed system has CRB (rocky.repo), Plus (rocky-extras.repo) and RT
# (rocky-addons.repo) enabled under their own repo IDs (crb, plus, rt).
osbuild_rocky_repo_files_enabled: true
osbuild_rocky_repo_files:
  - rocky.repo
  - rocky-extras.repo
  - rocky-addons.repo

# Append /etc/syncopated-release to every prepared blueprint: the blueprint
# name, target distro and the commit of this repository that produced it, so
# `cat /etc/syncopated-release` on an installed system names its source.
osbuild_release_file_enabled: true
# Short HEAD hash with a "-dirty" suffix for uncommitted changes; "unknown"
# when the role does not run from a git checkout. Lookups run on the controller.
osbuild_release_commit: >-
  {{ lookup('ansible.builtin.pipe',
     'git -C ' ~ (role_path | quote) ~ ' describe --always --abbrev=7 --dirty --exclude "*" 2>/dev/null || echo unknown') }}

# Append files/kickstart/syncopated.ks to every prepared blueprint as
# [customizations.installer.kickstart]. The install asks nothing: the kickstart
# creates the users in osbuild_users, locks root (unless osbuild_root_enabled),
# and lays out the disk from
# sizes computed at generation time (tasks/disk_layout.yml). The only possible
# prompt is the LUKS passphrase when osbuild_disk_encrypt is true. Blueprints
# must not carry [[customizations.user]], [[customizations.group]], unattended
# or sudo-nopasswd while this is on: image-builder rejects them next to a kickstart.
osbuild_kickstart_enabled: true
osbuild_kickstart_file: kickstart/syncopated.ks

# OpenSCAP hardening profile: none | cis-l2-workstation | pci-dss | hipaa.
# Set from the intent's `hardening`. Any profile other than none adds the
# openscap-<profile> component, the compliant disk layout, the workstation
# auditd.conf and tailoring (tasks/hardening.yml) and syncopated-scan.
osbuild_hardening: none

# SSG variable values for the tailoring of hardened builds, as
# {variable: value} without the xccdf_org.ssgproject.content_value_ prefix.
# tasks/hardening.yml writes them, with the unselected rules, to
# osbuild_openscap_tailoring_json; image-builder runs autotailor on that file
# (blueprint [customizations.openscap.json_tailoring]) and remediates with the
# result, and syncopated-scan evaluates against it. The intent's
# password_min_length sets var_password_pam_minlen here (CIS: 14, PCI-DSS: 12).
osbuild_openscap_variables: {}
# Where the JSON tailoring is written in the image (a file image-builder may
# write: under /etc, not /usr).
osbuild_openscap_tailoring_json: /etc/syncopated/openscap-tailoring.json

# Disk the installer lays out, from the intent's `disk` block.
#   size_gib  declared size of the target disk. Volume sizes are computed from
#             it at generation time; a smaller disk aborts the install, a
#             larger one gives the surplus to /home.
#   encrypt   LUKS on the physical volume (Anaconda asks for the passphrase;
#             no passphrase is ever written to a generated file).
#   tmp       tmpfs | lv: /tmp in the compliant layout.
#   serial    when set, the install aborts unless the selected disk has it.
osbuild_disk_size_gib: 0
osbuild_disk_encrypt: false
osbuild_disk_tmp: tmpfs
osbuild_disk_serial: ""

# Seconds the installer shows the target disk on a tty before partitioning;
# any key aborts the install.
osbuild_kickstart_countdown: 30

# Layout sizes. Usable space = declared disk size - 4 GiB (/boot, EFI
# partition, LVM metadata). All logical volumes are XFS in vg00.
#   1. reserve  reserve_percent of the usable space, at most reserve_max_gib,
#               stays unassigned in vg00 so a full volume can be grown with
#               `lvextend -r` (README: "When a volume fills up")
#   2. minimums every volume gets its *_min_gib
#   3. the rest is shared in proportion to the *_weight values until a volume
#      reaches its *_max_gib; space no volume can take stays unassigned
# filter_plugins/disk_layout.py does the arithmetic; tests/test_disk_sizing.py
# covers it. XFS cannot shrink: prefer maxima that are too small (grow later).
osbuild_kickstart_reserve_max_gib: 64

# Compliant layout (osbuild_hardening other than none): separate /usr, /var,
# /var/tmp, /var/log, /var/log/audit, /home and (disk tmp: lv) /tmp with
# nodev/nosuid/noexec mount options. Fixed volumes; /var and /home share the
# rest (var_min_gib..var_max_gib by var_weight, home_min_gib and up by
# home_weight). /var/log/audit is 4 GiB for CIS and PCI-DSS, 10 GiB for HIPAA
# (osbuild_audit_volume_gib); /usr is 80 GiB when nvidia or cuda-container
# is selected (osbuild_kickstart_cuda_usr_gib).
osbuild_kickstart_compliant_root_gib: 35
osbuild_kickstart_compliant_usr_gib: 60
osbuild_kickstart_compliant_tmp_gib: 8
osbuild_kickstart_compliant_var_tmp_gib: 8
osbuild_kickstart_compliant_var_log_gib: 10
osbuild_kickstart_compliant_var_min_gib: 40
osbuild_kickstart_compliant_var_max_gib: 185
osbuild_kickstart_compliant_var_weight: 2
osbuild_kickstart_compliant_home_min_gib: 10
osbuild_kickstart_compliant_home_weight: 5
osbuild_kickstart_compliant_reserve_percent: 8

# Simple layout (osbuild_hardening: none): /, /usr, /var and /home. /home is
# dropped (a directory on /) when the minimums do not fit with it.
osbuild_kickstart_reserve_percent: 8
osbuild_kickstart_root_min_gib: 20
osbuild_kickstart_root_max_gib: 64
osbuild_kickstart_root_weight: 1
osbuild_kickstart_usr_min_gib: 30
osbuild_kickstart_usr_max_gib: 110
osbuild_kickstart_usr_weight: 3
osbuild_kickstart_var_min_gib: 30
osbuild_kickstart_var_max_gib: 110
osbuild_kickstart_var_weight: 3
osbuild_kickstart_home_min_gib: 20
osbuild_kickstart_home_weight: 5

# The CUDA toolkit needs a large /usr (measured: 17 GiB right after install).
# Selecting any of these components raises /usr to osbuild_kickstart_cuda_usr_gib
# (simple layout: its minimum; compliant: its fixed size).
osbuild_kickstart_cuda_components: [nvidia, cuda-container]
osbuild_kickstart_cuda_usr_gib: 80

# Ship /etc/sudoers.d/90-wheel-nopasswd (%wheel ALL=(ALL) NOPASSWD: ALL).
osbuild_kickstart_sudoers: false

# =============================================================================
# Audit Policy (hardened builds)
# =============================================================================
# A standalone workstation keeps no long audit history: auditd rotates within
# a fixed cap and never halts, suspends or drops to single-user mode. Records
# that must be kept belong on a log host (osbuild_remote_logging).
osbuild_audit_policy:
  cis-l2-workstation: { max_log_file: 32, num_logs: 16, volume_gib: 4, noise_filter: true }
  pci-dss: { max_log_file: 32, num_logs: 16, volume_gib: 4, noise_filter: true }
  hipaa: { max_log_file: 64, num_logs: 32, volume_gib: 10, noise_filter: false }
# Free-space percentage below which syncopated-audit-warn warns (auditd
# space_left), and at which auditd rotates out the oldest log (admin_space_left).
osbuild_audit_warn_free_percent: 25
osbuild_audit_admin_free_percent: 10

# =============================================================================
# Remote Logging
# =============================================================================
# From the intent's `remote_logging` block. enabled: false (default) disables
# systemd-journal-upload and unselects its CIS rule. enabled: true ships the
# journal (audit events included, via journald) to url over mTLS. ca_cert,
# client_cert and client_key are PEM text or paths of PEM files on the
# controller; they are embedded in the blueprint (mode 0600 while they are).
osbuild_remote_logging:
  enabled: false

# [COMPATIBILITY] Retained for backward compatibility.
# Deprecated: composer-era output naming convention carried over for backward compatibility.
# Filename for the final image (UUID will be prepended)
osbuild_output_filename: "{{ osbuild_blueprint_name }}-{{ osbuild_distro }}.iso"

# Tag for container image types (container, container-minimal): the generated
# build script loads the OCI archive into podman and applies this tag.
osbuild_container_tag: "localhost/{{ osbuild_blueprint_name }}:latest"

# Distro-specific osbuild-composer repository config template
# Major-version based: the template tree is files/almalinux/10/... and
# files/rocky/10/..., so a point-release osbuild_distro (almalinux-10.2,
# rocky-10.2) must resolve to the major-only template name.
osbuild_repo_config_template: "{{ ansible_distribution | lower }}-{{ _osbuild_distro_major_version }}.json.j2"

# Keep build logs on failure
# [COMPATIBILITY] Retained for backward compatibility.
# Deprecated: composer-era log-retention behavior kept for backward compatibility.
osbuild_keep_logs: true

# Log directory
osbuild_log_dir: "/var/tmp/osbuild-logs"

# =============================================================================
# Advanced Configuration
# =============================================================================

# Path to osbuild work directory
osbuild_work_dir: "/var/lib/osbuild-composer"

# Directory to cache fetched gpgkey files (used by tasks/repo_keys.yml)
osbuild_gpgkey_cache_dir: "{{ osbuild_work_dir }}/gpgkeys"

# Minimum free disk space required (in GB)
osbuild_min_disk_space: 50

# Enable verbose output
osbuild_verbose: false

# =============================================================================
# bootc Configuration (Container-Based OS Images)
# =============================================================================

# bootc container image name (without tag)
osbuild_bootc_image_name: "quay.io/syncopated/{{ osbuild_blueprint_name }}"

# bootc container image tag
osbuild_bootc_image_tag: "latest"

# bootc workspace directory for Containerfile and build files
osbuild_bootc_workspace: "/tmp/bootc-workspace"

# bootc base image to build from
# Options:
#   - quay.io/fedora/fedora-bootc:43 (Fedora bootc base)
#   - ghcr.io/ublue-os/bazzite:stable (Universal Blue Bazzite)
#   - ghcr.io/ublue-os/aurora:stable (Universal Blue Aurora - KDE)
#   - ghcr.io/ublue-os/bluefin:stable (Universal Blue Bluefin - GNOME)
#   - ghcr.io/ublue-os/base-main:latest (Universal Blue Base)
osbuild_bootc_base_image: "quay.io/fedora/fedora-bootc:43"

# Build bootable disk image from container (qcow2/ISO)
osbuild_bootc_build_disk_image: false

# bootc disk image type (qcow2, iso, raw)
osbuild_bootc_image_type: "qcow2"

# Root filesystem type (btrfs, ext4, xfs)
osbuild_bootc_rootfs: "btrfs"

# bootc output directory for built disk images
osbuild_bootc_output_dir: "{{ osbuild_output_dir }}/bootc"

# bootc build timeout (in seconds) - disk image builds can take longer
osbuild_bootc_build_timeout: 7200 # 2 hours

# Enable Podman socket (required for bootc container builds)
osbuild_bootc_enable_podman_socket: true

# =============================================================================
# Ansible Role Inversion Pattern — Build-time Configuration
# =============================================================================
# These variables control build-time Ansible playbook execution in the Containerfile
# The playbook compiles configurations into /usr/etc (immutable vendor defaults)

# Include fstab in /usr/etc (typically handled by bootc disk config instead)
osbuild_include_fstab: false

# Kernel command line snippets (list of {name, cmdline} dicts)
# Example:
# osbuild_kernel_cmdline_snippets:
#   - name: "quiet"
#     cmdline: "quiet splash"
#   - name: "custom"
#     cmdline: "custom.param=value"
osbuild_kernel_cmdline_snippets: []

# Check every extra repository before generating or building: its repomd.xml
# must be downloadable and every file it lists must be served (NVIDIA's CUDA
# repo has published a repomd.xml whose files returned 404, which aborts
# depsolve). Metalink URLs (containing "?") are skipped. The generated build
# script repeats the check when it runs. Set false to skip the play-time check.
osbuild_repo_preflight: true
