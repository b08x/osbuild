# SPDX-License-Identifier: MIT-0
---
# Blueprint preparation for image-builder-cli (stateless)

- name: Decide whether the blueprint is composed from components
  ansible.builtin.set_fact:
    _osbuild_use_components: "{{ osbuild_blueprint_components | length > 0 }}"

- name: Render blueprint from components
  ansible.builtin.template:
    src: blueprint-components.toml.j2
    dest: "{{ osbuild_output_dir }}/{{ osbuild_blueprint_name }}.toml"
    mode: "{{ osbuild_output_mode }}"
    owner: "{{ osbuild_output_owner | default('', true) or omit }}"
  when: _osbuild_use_components

- name: Copy static blueprint file
  ansible.builtin.copy:
    src: "{{ osbuild_static_blueprint_path }}"
    dest: "{{ osbuild_output_dir }}/{{ osbuild_blueprint_name }}.toml"
    mode: "{{ osbuild_output_mode }}"
    owner: "{{ osbuild_output_owner | default('', true) or omit }}"
  when: not _osbuild_use_components

- name: Set blueprint file path
  ansible.builtin.set_fact:
    _osbuild_blueprint_file_path: "{{ osbuild_output_dir }}/{{ osbuild_blueprint_name }}.toml"

# The first-login splash lives once in files/firstboot/ and is appended to
# every blueprint here, after the copy/template step, so static and
# component-composed blueprints carry identical bytes. TOML ''' literal strings need no escaping
# but cannot contain ''' themselves.
- name: Inject first-login splash files
  when: osbuild_firstboot_enabled | bool
  vars:
    _osbuild_ansible_pull_args: >-
      {{ osbuild_ansible_pull_args.split()
         if osbuild_ansible_pull_args is string
         else osbuild_ansible_pull_args }}
    _osbuild_ansible_pull_enabled: >-
      {{ (osbuild_ansible_pull_repo | default('', true) | string | length > 0)
         and (_osbuild_ansible_pull_args | length > 0) }}
    _osbuild_firstboot_files:
      - { src: syncopated-firstboot, path: /usr/local/bin/syncopated-firstboot, mode: "0755" }
      - { src: syncopated-firstboot-launcher, path: /usr/local/bin/syncopated-firstboot-launcher, mode: "0755" }
      - { src: syncopated-firstboot.desktop, path: /etc/xdg/autostart/syncopated-firstboot.desktop, mode: "0644" }
  block:
    - name: Assert first-login files fit in TOML literal strings
      ansible.builtin.assert:
        that: "\"'''\" not in lookup('ansible.builtin.file', 'firstboot/' ~ item.src, rstrip=false)"
        fail_msg: "files/firstboot/{{ item.src }} contains ''' and cannot be embedded in a TOML literal string"
        quiet: true
      loop: "{{ _osbuild_firstboot_files }}"
      loop_control:
        label: "{{ item.src }}"

    - name: Assert ansible-pull settings fit in a TOML literal string
      ansible.builtin.assert:
        that: "\"'''\" not in lookup('ansible.builtin.template', 'ansible-pull.conf.j2', rstrip=false)"
        fail_msg: "osbuild_ansible_pull_repo/osbuild_ansible_pull_args contain ''' and cannot be embedded in a TOML literal string"
        quiet: true
      when: _osbuild_ansible_pull_enabled | bool

    - name: Append first-login files to blueprint
      ansible.builtin.blockinfile:
        path: "{{ _osbuild_blueprint_file_path }}"
        marker: "# {mark} syncopated-firstboot"
        block: "{{ lookup('ansible.builtin.template', 'firstboot-files.toml.j2') }}"
        insertafter: EOF

# The Flathub remote is shipped as a flatpakrepo file (files/flatpak/), which
# flatpak imports as a system remote, plus the flatpak package itself.
- name: Inject Flathub system remote
  when: osbuild_flathub_enabled | bool
  block:
    - name: Assert Flathub repo file fits in a TOML literal string
      ansible.builtin.assert:
        that: "\"'''\" not in lookup('ansible.builtin.file', 'flatpak/flathub.flatpakrepo', rstrip=false)"
        fail_msg: "files/flatpak/flathub.flatpakrepo contains ''' and cannot be embedded in a TOML literal string"
        quiet: true

    - name: Append Flathub remote to blueprint
      ansible.builtin.blockinfile:
        path: "{{ _osbuild_blueprint_file_path }}"
        marker: "# {mark} syncopated-flathub"
        block: "{{ lookup('ansible.builtin.template', 'flathub-remote.toml.j2') }}"
        insertafter: EOF

# Rocky ships CRB, Plus and RT in rocky.repo, rocky-extras.repo and
# rocky-addons.repo with enabled=0. The prepared copies under
# files/rocky/<major>/<arch>/yum.repos.d/ enable them and replace the
# packaged files in the image (rocky-repos marks them %config(noreplace), so
# updates write .rpmnew instead of reverting them).
- name: Inject Rocky repository files
  when:
    - osbuild_rocky_repo_files_enabled | bool
    - osbuild_target_distribution == 'Rocky'
  vars:
    _osbuild_rocky_repo_dir: "rocky/{{ _osbuild_distro_major_version }}/{{ osbuild_arch }}/yum.repos.d"
  block:
    - name: Assert Rocky repository files fit in TOML literal strings
      ansible.builtin.assert:
        that: "\"'''\" not in lookup('ansible.builtin.file', _osbuild_rocky_repo_dir ~ '/' ~ item, rstrip=false)"
        fail_msg: "files/{{ _osbuild_rocky_repo_dir }}/{{ item }} contains ''' and cannot be embedded in a TOML literal string"
        quiet: true
      loop: "{{ osbuild_rocky_repo_files }}"

    - name: Append Rocky repository files to blueprint
      ansible.builtin.blockinfile:
        path: "{{ _osbuild_blueprint_file_path }}"
        marker: "# {mark} syncopated-rocky-repos"
        block: "{{ lookup('ansible.builtin.template', 'rocky-repos.toml.j2') }}"
        insertafter: EOF

- name: Append release file to blueprint
  ansible.builtin.blockinfile:
    path: "{{ _osbuild_blueprint_file_path }}"
    marker: "# {mark} syncopated-release"
    block: "{{ lookup('ansible.builtin.template', 'release-file.toml.j2') }}"
    insertafter: EOF
  when: osbuild_release_file_enabled | bool

# Workstation audit policy, syncopated-scan and remote logging files, listed
# by tasks/hardening.yml. They are embedded as TOML literal strings.
- name: Inject hardening and remote logging files
  vars:
    _osbuild_inject_blocks:
      - marker: syncopated-hardening
        title: Workstation audit policy and syncopated-scan
        files: "{{ _osbuild_hardening_files | default([]) }}"
        dirs: "{{ _osbuild_hardening_dirs | default([]) }}"
      - marker: syncopated-remote-logging
        title: Remote logging (systemd-journal-upload over mTLS)
        files: "{{ _osbuild_remote_logging_files | default([]) }}"
        dirs: "{{ _osbuild_remote_logging_dirs | default([]) }}"
  block:
    - name: Assert injected files fit in TOML literal strings
      ansible.builtin.assert:
        that: "\"'''\" not in (item.1.content if item.1.content is defined else item.1.json | to_json)"
        fail_msg: "{{ item.1.path }} contains ''' and cannot be embedded in a TOML literal string"
        quiet: true
      loop: "{{ _osbuild_inject_blocks | subelements('files') }}"
      loop_control:
        label: "{{ item.1.path }}"

    - name: Append injected files to blueprint
      ansible.builtin.blockinfile:
        path: "{{ _osbuild_blueprint_file_path }}"
        marker: "# {mark} {{ item.marker }}"
        block: "{{ lookup('ansible.builtin.template', 'injected-files.toml.j2') }}"
        insertafter: EOF
        state: "{{ 'present' if item.files | length > 0 else 'absent' }}"
      vars:
        _osbuild_inject_title: "{{ item.title }}"
        _osbuild_inject_source: hardening.yml
        _osbuild_inject_files: "{{ item.files }}"
        _osbuild_inject_dirs: "{{ item.dirs | default([]) }}"
      loop: "{{ _osbuild_inject_blocks }}"
      loop_control:
        label: "{{ item.marker }}"
      no_log: true

# The installer kickstart lives once in files/kickstart/ and is appended the
# same way. image-builder rejects user-supplied kickstart contents next to
# [[customizations.user]], [[customizations.group]], unattended or
# sudo-nopasswd, so a blueprint that still carries them fails here instead of
# deep inside the build.
- name: Inject installer kickstart
  when: osbuild_kickstart_enabled | bool
  block:
    - name: Read prepared blueprint
      ansible.builtin.slurp:
        src: "{{ _osbuild_blueprint_file_path }}"
      register: _osbuild_blueprint_raw

    - name: Assert blueprint has no settings that conflict with a kickstart
      ansible.builtin.assert:
        that: _osbuild_kickstart_conflicts | length == 0
        fail_msg: >-
          {{ _osbuild_blueprint_file_path }} contains {{ _osbuild_kickstart_conflicts | join(', ') }},
          which image-builder rejects next to [customizations.installer.kickstart].
          Remove them or set osbuild_kickstart_enabled: false.
        quiet: true
      vars:
        _osbuild_kickstart_conflicts: >-
          {{ _osbuild_blueprint_raw.content | b64decode
             | regex_findall('(?m)^\s*(\[\[customizations\.(?:user|group)\]\]|unattended|sudo-nopasswd)(?=\s|=|$)')
             | unique }}

    - name: Assert kickstart fits in a TOML literal string
      ansible.builtin.assert:
        that: "\"'''\" not in lookup('ansible.builtin.file', osbuild_kickstart_file, rstrip=false)"
        fail_msg: "files/{{ osbuild_kickstart_file }} contains ''' and cannot be embedded in a TOML literal string"
        quiet: true

    - name: Compute the disk layout
      ansible.builtin.include_tasks: disk_layout.yml

    - name: Create the installer users
      ansible.builtin.include_tasks: credentials.yml

    - name: Append installer kickstart to blueprint
      ansible.builtin.blockinfile:
        path: "{{ _osbuild_blueprint_file_path }}"
        marker: "# {mark} syncopated-kickstart"
        block: "{{ lookup('ansible.builtin.template', 'kickstart.toml.j2') }}"
        insertafter: EOF
      no_log: true

    - name: Assert no LUKS passphrase reached the blueprint
      ansible.builtin.assert:
        that: "'--passphrase' not in lookup('ansible.builtin.template', 'kickstart.toml.j2')"
        fail_msg: "The rendered kickstart contains --passphrase; LUKS passphrases are never written to generated files."
        quiet: true

    - name: Write the initial passwords next to the outputs
      ansible.builtin.copy:
        dest: "{{ osbuild_output_dir }}/{{ osbuild_blueprint_name }}.credentials.txt"
        mode: "0600"
        owner: "{{ osbuild_output_owner | default('', true) or omit }}"
        content: |
          # {{ osbuild_blueprint_name }}: initial passwords, generated {{ now(utc=true).strftime('%Y-%m-%dT%H:%M:%SZ') }}.
          # Each user must choose a new password at first login.{{ ' Root is locked;' if not osbuild_root_enabled | bool else '' }}
          # {{ 'use sudo. ' if not osbuild_root_enabled | bool else 'Root must too. ' }}Delete this file once the machine is installed.
          {% for u in _osbuild_users %}
          {{ u.name }}: {{ _osbuild_user_passwords[u.name] }}
          {% endfor %}
          {% if osbuild_root_enabled | bool %}
          root: {{ _osbuild_root_password }}
          {% endif %}
      no_log: true

- name: Append passwordless sudo for wheel to blueprint
  ansible.builtin.blockinfile:
    path: "{{ _osbuild_blueprint_file_path }}"
    marker: "# {mark} syncopated-sudoers"
    block: "{{ lookup('ansible.builtin.template', 'kickstart-sudoers.toml.j2') }}"
    insertafter: EOF
  when: osbuild_kickstart_sudoers | bool

- name: Display blueprint path
  ansible.builtin.debug:
    msg: "Blueprint ready: {{ _osbuild_blueprint_file_path }}"

# Exit 3 means no TOML parser (Python < 3.11 without python3-tomli): the check
# is skipped. Any other non-zero exit is a parse error and fails the play.
- name: TOML syntax check
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import sys
        try:
            import tomllib as toml
        except ImportError:
            try:
                import tomli as toml
            except ImportError:
                sys.exit(3)
        with open(sys.argv[1], "rb") as f:
            toml.load(f)
      - "{{ _osbuild_blueprint_file_path }}"
  register: _osbuild_toml_check
  changed_when: false
  failed_when: _osbuild_toml_check.rc not in [0, 3]

- name: Report TOML syntax check
  ansible.builtin.debug:
    msg: >-
      {{ '✓ Blueprint TOML syntax is valid' if _osbuild_toml_check.rc == 0
         else '⚠ TOML validation skipped (no tomllib or python3-tomli)' }}
