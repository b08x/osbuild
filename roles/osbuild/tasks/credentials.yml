---
# Installer users with throwaway passwords. Every run makes a new random
# password per user on the controller; only its SHA-512 crypt hash reaches the
# blueprint (templates/kickstart.toml.j2). The plaintext is shown once at the
# end of the play (tasks/main.yml) and written, mode 0600, to
# <osbuild_output_dir>/<blueprint>.credentials.txt by tasks/blueprint.yml.
# The kickstart expires each password (chage -d 0), so the first login asks
# for a new one.

- name: Check passlib on the controller
  ansible.builtin.include_tasks: passlib.yml

- name: Assert at least one user is defined
  ansible.builtin.assert:
    that:
      - osbuild_users is sequence
      - osbuild_users is not string
      - osbuild_users | length > 0
      - osbuild_users | map(attribute='name') | unique | list | length == osbuild_users | length
    fail_msg: >-
      The installer asks nothing, so osbuild_users (intent `users`) must name
      at least one user, each name once.
    quiet: true

- name: Collect the groups the selected components need
  ansible.builtin.set_fact:
    _osbuild_component_user_groups: >-
      {{ osbuild_blueprint_components | map('extract', _osbuild_bp_components | default({}))
         | map(attribute='user_groups', default=[]) | flatten | unique | list }}

# Templated values are evaluated lazily, each time they are used: the
# password is fixed in one task and hashed in the next, so the hash belongs to
# the password that is reported.
- name: Start with no users
  ansible.builtin.set_fact:
    _osbuild_user_passwords: {}
    _osbuild_users: []

- name: Generate throwaway passwords
  no_log: true
  ansible.builtin.set_fact:
    _osbuild_user_passwords: >-
      {{ _osbuild_user_passwords | combine({item.name: lookup('ansible.builtin.password', '/dev/null',
                                                              length=20, chars=['ascii_letters', 'digits'])}) }}
  loop: "{{ osbuild_users }}"
  loop_control:
    label: "{{ item.name }}"

- name: Build the installer users
  no_log: true
  ansible.builtin.set_fact:
    _osbuild_users: "{{ _osbuild_users + [_user] }}"
  vars:
    _user:
      name: "{{ item.name }}"
      gecos: "{{ item.gecos | default(item.name) }}"
      groups: "{{ (['wheel'] + _osbuild_component_user_groups + (item.groups | default([]))) | unique | list }}"
      uid: "{{ item.uid | default(none) }}"
      ssh_pubkey: "{{ item.ssh_pubkey | default('') }}"
      password_hash: "{{ _osbuild_user_passwords[item.name] | password_hash('sha512') }}"
  loop: "{{ osbuild_users }}"
  loop_control:
    label: "{{ item.name }}"
