# git-cliff ~ configuration file
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.
"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | split(pat="\n") | first | upper_first }}\
    {% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = false
filter_unconventional = false
commit_parsers = [
    { message = "(?i)^(?:[^a-z0-9]*\\s*)?feat", group = "<!-- 0 -->🚀 Features" },
    { message = "(?i)^(?:[^a-z0-9]*\\s*)?fix", group = "<!-- 1 -->🐛 Bug Fixes" },
    { message = "(?i)^(?:[^a-z0-9]*\\s*)?refactor", group = "<!-- 2 -->🚜 Refactor" },
    { message = "(?i)^(?:[^a-z0-9]*\\s*)?doc", group = "<!-- 3 -->📚 Documentation" },
    { message = "(?i)^(?:[^a-z0-9]*\\s*)?perf", group = "<!-- 4 -->⚡ Performance" },
    { message = "(?i)^(?:[^a-z0-9]*\\s*)?style", group = "<!-- 5 -->🎨 Styling" },
    { message = "(?i)^(?:[^a-z0-9]*\\s*)?test", group = "<!-- 6 -->🧪 Testing" },
    { message = "(?i)^(?:[^a-z0-9]*\\s*)?chore\\(release\\): prepare for", skip = true },
    { message = "(?i)^(?:[^a-z0-9]*\\s*)?chore\\(deps.*\\)", skip = true },
    { message = "(?i)^(?:[^a-z0-9]*\\s*)?chore\\(pr\\)", skip = true },
    { message = "(?i)^(?:[^a-z0-9]*\\s*)?chore\\(pull\\)", skip = true },
    { message = "(?i)^(?:[^a-z0-9]*\\s*)?chore|(?i)^(?:[^a-z0-9]*\\s*)?ci", group = "<!-- 7 -->⚙️ Miscellaneous Tasks" },
    { body = ".*security", group = "<!-- 8 -->🛡️ Security" },
    { message = "(?i)^(?:[^a-z0-9]*\\s*)?revert", group = "<!-- 9 -->◀️ Revert" },
    { message = ".*", group = "<!-- 10 -->💼 Other" },
]
filter_commits = false
topo_order_commits = true
sort_commits = "oldest"
