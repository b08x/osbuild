# SPDX-License-Identifier: MIT-0
---
# Rocky Linux 10.2 workstation ISO, composed from package components, hardened
# with one OpenSCAP profile (osbuild_openscap_profile).
#
# Profiles map to components openscap-<profile> (cis-l2-workstation, hipaa,
# pci-dss). Each adds the profile's packages, services and audit kernel args
# plus [customizations.openscap]; image-builder then runs the profile's
# remediation against the installed-OS tree at build time. Select with
#   ansible-playbook playbooks/osbuild-rocky-iso-openscap-components.yml \
#     -e osbuild_openscap_profile=hipaa
#
# Disk layout: osbuild_kickstart_partitioning is "compliant" (separate /usr,
# /var, /var/tmp, /var/log, /var/log/audit, /home; /tmp on tmpfs; mount options
# nodev/nosuid/noexec set in the kickstart because Anaconda writes fstab after
# the build-time remediation). LUKS is on for hipaa and pci-dss only; Anaconda
# asks for the passphrase. Needs a disk of at least 160 GiB. A partition_for_tmp
# rule can still flag tmpfs; set osbuild_kickstart_compliant_tmp: lv for a volume.
# The kickstart sudoers drop-in (NOPASSWD) is written at install time, after
# remediation, and fails sudo_remove_nopasswd unless osbuild_kickstart_sudoers
# is false.

- name: Generate Rocky Linux 10.2 OpenSCAP-hardened workstation ISO blueprint from components
  hosts: builder
  become: true
  gather_facts: false
  vars:
    # cis-l2-workstation | hipaa | pci-dss
    osbuild_openscap_profile: "cis-l2-workstation"

    # Must match a name `image-builder list` reports; major-only "rocky-10"
    # is not a known distro. image-builder 84 on gir ships rocky-10.0/10.1/10.2
    # image-installer for x86_64.
    osbuild_distro: "rocky-10.2"
    osbuild_arch: "x86_64"

    osbuild_blueprint_name: "rocky-10-2-workstation-openscap-{{ osbuild_openscap_profile }}"
    osbuild_blueprint_version: "1.0.0"
    osbuild_hostname: "syncopated-dx"
    osbuild_blueprint_description: "Rocky Linux Workstation 10.2 (OpenSCAP {{ osbuild_openscap_profile }})"

    # Composed from component files; see header.
    osbuild_blueprint_components:
      - base
      - anaconda
      - gnome-desktop
      - fonts
      - audio
      - multimedia
      - google-chrome
      - vscode
      - gui-toolkit
      - intel-graphics
      - development
      - containers-virt
      - cockpit
      - syncopated
      - "openscap-{{ osbuild_openscap_profile }}"

    # Build mode: traditional ISO, not bootc. Generate files only; do not
    # invoke image-builder. "minimal-installer" is Fedora-only; EL
    # distributions expose image-installer.
    osbuild_only_generate: true
    osbuild_build_bootc: false
    osbuild_image_type: image-installer

    osbuild_kickstart_partitioning: compliant
    osbuild_kickstart_compliant_tmp: tmpfs
    osbuild_kickstart_compliant_encrypt: "{{ osbuild_openscap_profile in ['hipaa', 'pci-dss'] }}"

    # Suppress the host-derived (Fedora) common source list. See header.
    osbuild_sources: []

    # --extra-repo URLs come from the components' repo_urls.

    osbuild_output_dir: "/var/tmp/osbuild-images"
    # _git_commit is set in pre_tasks: short HEAD hash of this repo, with a
    # "-dirty" suffix when the working tree has uncommitted changes.
    osbuild_output_filename: "rocky-10-2-workstation-openscap-{{ osbuild_openscap_profile }}-{{ _git_commit }}.iso"

    osbuild_build_retries: 1

  pre_tasks:
    - name: Gather facts as unprivileged connection user
      ansible.builtin.setup:
      become: false
      tags: ["always"]

    - name: Verify build host is Fedora or an EL 10 distribution
      ansible.builtin.assert:
        that:
          - >-
            ansible_distribution == "Fedora" or
            (ansible_distribution in ["AlmaLinux", "Rocky"] and
             ansible_distribution_major_version == "10")
        fail_msg: >-
          This playbook builds the Rocky Linux 10.2 blueprint and must
          run on a Fedora or EL 10 host. Detected: {{ ansible_distribution }}
          {{ ansible_distribution_version }}.
        success_msg: "Build host '{{ ansible_distribution }} {{ ansible_distribution_version }}' is supported."
      tags: ["always"]

    # Lookups run on the controller; set_fact evaluates this once, so every
    # role task sees the same image name.
    - name: Set image name commit
      ansible.builtin.set_fact:
        _git_commit: >-
          {{ lookup('ansible.builtin.pipe',
             'git -C ' ~ (playbook_dir | quote) ~ ' describe --always --abbrev=7 --dirty --exclude "*"') }}
      tags: ["always"]

    - name: List image types known to the installed image-builder
      ansible.builtin.command: image-builder list
      register: _image_builder_list
      changed_when: false
      tags: ["always"]

    - name: Verify image-builder can build the requested distro and image type
      ansible.builtin.assert:
        that:
          - _wanted in _image_builder_list.stdout_lines
        fail_msg: >-
          '{{ _wanted }}' is not in `image-builder list` on {{ inventory_hostname }}.
          Upgrade image-builder or change osbuild_distro.
        success_msg: "image-builder supports '{{ _wanted }}'."
      vars:
        _wanted: "{{ osbuild_distro }} type:{{ osbuild_image_type }} arch:{{ osbuild_arch }}"
      tags: ["always"]

  roles:
    - role: osbuild
