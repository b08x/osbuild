---
# Build a host-native bootc container image (default) or a VM disk image
# with the image-builder CLI. Targets: Fedora, AlmaLinux, Rocky Linux.
#
# Installer ISOs are not built here: they come from a validated intent,
#   ansible-playbook playbooks/build.yml -e @profiles/<name>.yml
# (see profiles/examples/). The play refuses installer image types.
#
#   ansible-playbook osbuild.yml                                   # bootc image
#   ansible-playbook osbuild.yml -e osbuild_build_bootc=false \
#     -e osbuild_image_type=qcow2                                  # VM disk image

- name: Build custom workstation image
  hosts: osbuild_targets
  become: true
  gather_facts: true

  vars:
    # Distribution & arch
    # image-builder resolves point-release distro names on EL — the installed
    # binary (live `image-builder list` on tinybot, 2026-10-01) knows
    # almalinux-9.8/10.2 and rocky-9.8/10.2 but no major-only `almalinux-10`
    # or `rocky-10` entry. Fedora uses major-version names (fedora-43).
    # Override per host/group vars when a different point release is wanted.
    osbuild_distro_default:
      Fedora: "fedora-{{ ansible_distribution_major_version }}"
      AlmaLinux: "almalinux-{{ '9.8' if ansible_distribution_major_version == '9' else '10.2' }}"
      Rocky: "rocky-{{ '9.8' if ansible_distribution_major_version == '9' else '10.2' }}"
    osbuild_distro: "{{ osbuild_distro_default[ansible_distribution] }}"
    osbuild_arch: "x86_64"
    # Blueprint
    osbuild_blueprint_name: "workstation"
    osbuild_blueprint_version: "1.0.0"
    osbuild_blueprint_description: "Custom Workstation"

    # Build mode: bootc container image. With -e osbuild_build_bootc=false the
    # role generates a blueprint + build script for osbuild_image_type
    # (-e osbuild_only_generate=false builds in the play).
    osbuild_build_bootc: true

    # Image type for non-bootc builds: a VM disk image (qcow2, vmdk, ami, ...).
    # Installer types (image-installer, minimal-installer, network-installer)
    # go through playbooks/build.yml.
    osbuild_image_type: qcow2

    # VM images are not installed by Anaconda: no kickstart, no splash.
    osbuild_kickstart_enabled: false
    osbuild_firstboot_enabled: false

    # Components: names of files in
    # roles/osbuild/files/<distro>/<major>/<arch>/components/ (all four
    # targets ship these names; sway exists only for Fedora 43).
    # Override osbuild_blueprint_components to pick another set.
    osbuild_blueprint_components_default:
      Fedora: &components_fedora
        - base
        - anaconda
        - gnome-desktop
        - fonts
        - audio
        - multimedia
        - google-chrome
        - vscode
        - intel-graphics
        - development
        - containers-virt
        - cockpit
        - sway
        - nvidia
      AlmaLinux: &components_el
        - base
        - anaconda
        - gnome-desktop
        - fonts
        - audio
        - multimedia
        - google-chrome
        - vscode
        - intel-graphics
        - development
        - containers-virt
        - cockpit
        - nvidia
        - syncopated
      Rocky: *components_el
    osbuild_blueprint_components: "{{ osbuild_blueprint_components_default[ansible_distribution] }}"

    # Output
    osbuild_output_dir: "/var/tmp/osbuild-images"

    # bootc
    osbuild_bootc_image_name: "quay.io/syncopated/workstation"
    osbuild_bootc_base_image: "quay.io/fedora/fedora-bootc:43"

    # Retry
    osbuild_build_retries: 0

    # Extra repos
    osbuild_extra_repo_urls: []

  pre_tasks:
    - name: Verify supported distribution
      ansible.builtin.assert:
        that:
          - ansible_distribution in ["Fedora", "AlmaLinux", "Rocky"]
        fail_msg: >-
          Unsupported distribution '{{ ansible_distribution }}.
          This playbook targets Fedora, AlmaLinux, and Rocky Linux only.
        success_msg: >-
          Target distribution '{{ ansible_distribution }}' is supported.

    - name: Refuse installer ISOs (they are built from intents)
      ansible.builtin.assert:
        that: >-
          osbuild_build_bootc | bool
          or osbuild_image_type not in ['image-installer', 'minimal-installer', 'network-installer']
        fail_msg: >-
          Installer ISOs are generated from a validated intent:
          ansible-playbook playbooks/build.yml -e @profiles/<name>.yml
          (examples in profiles/examples/).
        quiet: true

  roles:
    - role: osbuild
