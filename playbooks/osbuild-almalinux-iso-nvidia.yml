# SPDX-License-Identifier: MIT-0
---
# Build the AlmaLinux 10.2 workstation ISO installer (NVIDIA variant) on tinybot.
#
# Composes the blueprint from the component files in
# roles/osbuild/files/almalinux/10/x86_64/components/ and the frame
# files/almalinux/10/x86_64/frames/workstation.toml. The package names were
# checked package-by-package against live AlmaLinux 10 / EPEL 10 / RPM Fusion
# EL 10 repodata and intentionally exclude sway (no EPEL 10 build).
#
# The nvidia component carries the CUDA EL10 and NVIDIA Container Toolkit
# repositories (fragment nvidia.toml) and passes their URLs to image-builder
# as --extra-repo (repo_urls), so no extra URLs are listed here.
#
# tinybot is itself AlmaLinux 10, so it builds its own distro's installer.

- name: Build AlmaLinux 10.2 workstation ISO installer (NVIDIA)
  hosts: tinybot
  become: true
  gather_facts: false
  vars:
    # image-builder 52.1 (installed on tinybot) only ships distro definitions
    # up to almalinux-10.2 — `image-builder list` has no almalinux-10.3 entry
    # yet, so 10.2 is what's actually buildable today.
    osbuild_distro: "almalinux-10.2"
    osbuild_arch: "x86_64"

    osbuild_blueprint_name: "almalinux-10-2-workstation-nvidia"
    osbuild_blueprint_version: "1.0.0"
    osbuild_blueprint_description: "AlmaLinux Workstation 10.2 (NVIDIA)"

    # The CUDA toolkit needs a larger /usr than the default 30 GiB minimum
    # (measured install: 17 GiB used right after installation). Disks under
    # 150 GiB abort; see the role README, "Layout".
    osbuild_kickstart_usr_min_gib: 80
    osbuild_kickstart_disk_min_gib: 150

    # Composed from component files; see header.
    osbuild_blueprint_components:
      - base
      - anaconda
      - gnome-desktop
      - fonts
      - audio
      - multimedia
      - google-chrome
      - vscode
      - intel-graphics
      - development
      - containers-virt
      - cockpit
      - nvidia
      - syncopated

    # Build mode: traditional ISO, not bootc. The role default
    # (osbuild_only_generate: true) writes the blueprint and
    # build-<blueprint>.sh; pass -e osbuild_only_generate=false to build here.
    # "minimal-installer" is Fedora-only in image-builder; AlmaLinux only
    # exposes image-installer/network-installer (confirmed via
    # `image-builder list | grep almalinux-10.2` on tinybot).
    osbuild_build_bootc: false
    osbuild_image_type: image-installer

    # --extra-repo URLs come from the components' repo_urls.
    osbuild_sources: []

    osbuild_output_dir: "/var/tmp/osbuild-images"
    # _git_commit is set in pre_tasks: short HEAD hash of this repo, with a
    # "-dirty" suffix when the working tree has uncommitted changes.
    osbuild_output_filename: "almalinux-10-2-workstation-nvidia-{{ _git_commit }}.iso"

    osbuild_build_retries: 1

  pre_tasks:
    # Lookups run on the controller; set_fact evaluates this once, so every
    # role task sees the same image name.
    - name: Set image name commit
      ansible.builtin.set_fact:
        _git_commit: >-
          {{ lookup('ansible.builtin.pipe',
             'git -C ' ~ (playbook_dir | quote) ~ ' describe --always --abbrev=7 --dirty --exclude "*"') }}
      tags: ["always"]

    - name: Gather facts as unprivileged connection user
      ansible.builtin.setup:
      become: false
      tags: ["always"]

    - name: Verify build host is AlmaLinux
      ansible.builtin.assert:
        that:
          - ansible_distribution == "AlmaLinux"
          - ansible_distribution_major_version == "10"
        fail_msg: >-
          This playbook builds the AlmaLinux 10.2 NVIDIA blueprint and must run on an
          AlmaLinux 10 host. Detected: {{ ansible_distribution }}
          {{ ansible_distribution_version }}.
        success_msg: "Target distribution '{{ ansible_distribution }} {{ ansible_distribution_version }}' is supported."

  roles:
    - role: osbuild
