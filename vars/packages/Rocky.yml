---
# Canonical Package Taxonomy for Rocky Linux
# Maintained with scripts/package_tracker.py
# System Package Taxonomy for Rocky Linux
# Collection-level package definitions for immutable bootc images
# Used by roles: osbuild, audio, sway, workstation, tools, etc.
#
# NOTE: Verified against live Rocky Linux 9/10 BaseOS, AppStream, CRB,
# EPEL 9/10, and RPM Fusion EL repodata (2026-10-01): every taxonomy name
# that resolves on AlmaLinux 10 also resolves on Rocky 9/10. Names with no
# EL/EPEL build (the sway/wlroots stack, sway-adjacent desktop extras, and
# component packages that ship from their own repos — CUDA, Docker CE,
# VS Code, Chrome) are the same set the AlmaLinux file carries; components
# select only the names their target repos provide. Package names alias
# the EL taxonomy via the `rocky:` keys in 00-distributions.yml.
#
# Naming Convention: system_packages.{category}.{subcategory}
# - Top-level categories follow the XDG Desktop Entry Specification
#   registered categories (System, Settings, Graphics, AudioVideo,
#   Development, Utility); only categories in use are defined.
# - Keep lists flat and explicit (no hidden aggregations)
# - Separate DNF groups, Flatpaks, and system packages
# - Versions are NEVER pinned here — every package resolves to "*".
#   Pin overrides belong in group_vars/host_vars via osbuild_package_pins.

# =============================================================================
# System Packages (DNF/YUM)
# =============================================================================

