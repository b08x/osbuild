system_groups:
  # Base system groups
  base:
    - c-development
    - headless-management
    - development-tools
    - container-management
    - system-tools
    - admin-tools

  # Audio production
  audio:
    - "Audio Production"

  # Publishing tools
  publishing:
    - "authoring-and-publishing"

# =============================================================================
# Flatpak Applications (System-Level)
# =============================================================================
# Note: User-specific Flatpaks managed via yadm bootstrap

system_flatpaks:
  # Productivity & Knowledge Management
  productivity:
    - md.obsidian.Obsidian
    - io.typora.Typora

  # Media Creation
  media:
    - org.audacityteam.Audacity
    - org.freac.freac
    - org.pipewire.Helvum
    - io.gitlab.theevilskeleton.Upscaler
    - io.github.ltiber.Pwall
    - io.github.bhack.mini-eq
    - org.nomacs.ImageLounge

  # Development Tools
  development:
    - io.podman_desktop.PodmanDesktop
    - io.dbeaver.DBeaverCommunity

  # System Utilities
  system:
    - com.github.tchx84.Flatseal
    - org.gnome.Extensions
    - io.github.vikdevelop.SaveDesktop
    - com.saivert.pwvucontrol
    - com.mattjakeman.ExtensionManager
    - org.gnome.Extensions
    - page.tesk.Refine
    - com.discordapp.Discord

# =============================================================================
# COPR Repositories (Package Sources)
# =============================================================================

system_copr_repos:
  # COPR for EL targets uses different naming
  audio:
    []
    # - "@audinux/stable-audio"

  tools: []
# - "elegos/gitflow"
# - "atim/lazydocker"

# =============================================================================
# Build Host Packages (Ansible Control Node)
# =============================================================================
# Packages installed on the machine running Ansible, not in the bootc image

build_host_packages:
  - osbuild
  - image-builder
  - bash-completion
  - firewalld
  - openscap-scanner
  - scap-security-guide

# =============================================================================
# Legacy Flat Lists (absorbed from roles/osbuild/vars/packages.yml)
# =============================================================================
# These flat lists are retained for backward compatibility.
# New code should reference the structured system_packages taxonomy above.

osbuild_legacy:
  # Sway and the wlroots/Wayland-compositor stack are NOT available in EPEL 10
  sway_packages: []
  nvidia_packages:
    - cuda-toolkit
    - nvidia-container-toolkit
    - nvidia-driver
    - nvidia-driver-cuda
    - nvidia-driver-cuda-libs
    - nvidia-driver-libs
    - nvidia-persistenced
    - nvidia-settings
    - nvidia-gpu-firmware
    - dkms

  development_packages:
    - bats
    - cmake
    - gcc
    - gcc-c++
    - git
    - make
    - nodejs
    - nodejs-npm
    - python3
    - python3-devel
    - python3-pip

  container_packages:
    - buildah
    - containers-common
    - podman
    - podman-compose
    - skopeo

  oneapi_packages:
    - intel-basekit
    - intel-hpckit
# =============================================================================
# User-Level Package Management (Excluded from Ansible)
# =============================================================================
# The following package types are managed via yadm bootstrap scripts:
# - NPM global packages: @anthropic-ai/claude-code, @google/gemini-cli
# - VS Code extensions: anthropic.claude-code, openai.chatgpt, etc.
# - Cargo packages: User-installed Rust tools
# - pipx packages: User-installed Python CLI tools
# - Ruby gems: User-installed gems via rbenv/asdf
