name = "hardened_xccdf_org.ssgproject.content_profile_hipaa"
description = "Health Insurance Portability and Accountability Act (HIPAA)"
version = "0.1.82"

[customizations.openscap]
profile_id = "xccdf_org.ssgproject.content_profile_hipaa"
# If your hardening data stream is not part of the 'scap-security-guide' package
# provide the absolute path to it (from the root of the image filesystem).
datastream = "/usr/share/xml/scap/ssg/content/ssg-rhel10-ds.xml"


# [[customizations.filesystem]]
# mountpoint = "/var/log/audit"
# size = 10737418240

# [[packages]]
# name = "sequoia-sq"
