[[packages]]
name = "rsyslog"
version = "*"

[[packages]]
name = "cronie"
version = "*"

[[packages]]
name = "postfix"
version = "*"

[[packages]]
name = "audit"
version = "*"

[customizations.kernel]
append = "audit_backlog_limit=8192 audit=1"

[customizations.services]
enabled = ["auditd", "crond", "rsyslog"]
disabled = []
