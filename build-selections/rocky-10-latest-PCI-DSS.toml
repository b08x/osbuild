name = "hardened_xccdf_org.ssgproject.content_profile_pci-dss"
description = "PCI-DSS v4.0.1 Control Baseline for Red Hat Enterprise Linux 10"
version = "0.1.82"

[customizations.openscap]
profile_id = "xccdf_org.ssgproject.content_profile_pci-dss"
# If your hardening data stream is not part of the 'scap-security-guide' package
# provide the absolute path to it (from the root of the image filesystem).
datastream = "/usr/share/xml/scap/ssg/content/ssg-rhel10-ds.xml"


[[packages]]
name = "aide"
version = "*"

[[packages]]
name = "sudo"
version = "*"

[[packages]]
name = "cryptsetup"
version = "*"

[[packages]]
name = "sequoia-sq"
version = "*"

[[packages]]
name = "logrotate"
version = "*"

[[packages]]
name = "firewalld"
version = "*"

[[packages]]
name = "nftables"
version = "*"

[[packages]]
name = "libselinux"
version = "*"

[[packages]]
name = "cronie"
version = "*"

[[packages]]
name = "postfix"
version = "*"

[[packages]]
name = "chrony"
version = "*"

[[packages]]
name = "audispd-plugins"
version = "*"

[[packages]]
name = "audit"
version = "*"

[customizations.kernel]
append = "audit_backlog_limit=8192 audit=1"

[customizations.services]
enabled = ["auditd", "firewalld"]
disabled = []
